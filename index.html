    out:SVG('<path d="M14 8v-2a2 2 0 0 0 -2 -2h-7a2 2 0 0 0 -2 2v12a2 2 0 0 0 2 2h7a2 2 0 0 0 2 -2v-2"/><path d="M9 12h12l-3 -3"/><path d="M18 15l3 -3"/>'),
    bolt:SVG('<path d="M13 3l0 7l6 0l-8 11l0 -7l-6 0l8 -11"/>')
  };
  const G='<svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>';
  const LS={get(){try{return JSON.parse(localStorage.getItem('pidemas_customer_info')||'null')||{}}catch(e){return {}}},set(o){try{localStorage.setItem('pidemas_customer_info',JSON.stringify({...LS.get(),...o}))}catch(e){}}};
  const usuario=()=>{try{return pdClienteSesion||null}catch(e){return null}};
  /* Datos guardados: primero la cuenta de Google (sirve en cualquier teléfono), luego este teléfono */
  function datos(){
    const u=usuario(),m=(u&&u.user_metadata)||{},l=LS.get();
    const num=v=>{const n=Number(v);return v!==''&&v!=null&&Number.isFinite(n)?n:null};
    return {
      nombre:m.full_name||m.name||l.nombre_cliente||'',
      telefono:m.phone||l.telefono_cliente||'',
      correo:m.contact_email||'',
      direccion:m.address||l.direccion||'',
      referencia:m.address_reference||l.referencia||'',
      lat:num(m.delivery_lat??l.lat),lng:num(m.delivery_lng??l.lng)
    };
  }
  window.pdDatosClienteGuardados=datos;
  let borrador=null,vista='';

  function overlay(){
    const o=$('pdGoogleAuthOverlay');if(!o)return null;
    if(!o.querySelector('.pcSheet')){
      o.innerHTML='<section class="pcSheet" role="dialog" aria-modal="true" aria-labelledby="pcTitulo"><div class="pcTop"><strong id="pcTitulo">Mi cuenta</strong><button type="button" class="pcX" aria-label="Cerrar">×</button></div><div class="pcBody"></div><div class="pcFoot"></div></section>';
      o.addEventListener('click',e=>{if(e.target.closest('.pcX'))window.pdCerrarCuentaCliente()});
    }
    return o;
  }
  function msg(t,ok){const m=document.querySelector('#pdGoogleAuthOverlay .pcMsg');if(m){m.textContent=t||'';m.classList.toggle('ok',!!ok)}}
  function pintarLogin(){
    vista='login';const o=overlay();if(!o)return;
    o.querySelector('#pcTitulo').textContent='Mi cuenta';
    o.querySelector('.pcBody').innerHTML='<div class="pcHero"><div class="pcBrand"><img alt="Pidemás Delivery" src="'+((document.querySelector('.pidemas-header-logo')||{}).src||'')+'"></div><h2>Pide más rápido</h2><p>Entra con tu cuenta de Google y tus datos quedarán listos en cada pedido.</p></div>'+
      '<ul class="pcBen"><li><i>'+IC.pin+'</i><span><b>Tu ubicación guardada</b><small>El motorizado llega directo a tu puerta.</small></span></li>'+
      '<li><i>'+IC.bolt+'</i><span><b>Pedidos en segundos</b><small>Nombre, celular y dirección se llenan solos.</small></span></li>'+
      '<li><i>'+IC.route+'</i><span><b>Sigue tus pedidos</b><small>Mira en qué paso va tu pedido desde cualquier teléfono.</small></span></li></ul>';
    o.querySelector('.pcFoot').innerHTML='<button type="button" class="pcGoogle" id="pcGoogleBtn">'+G+'Continuar con Google</button><p class="pcMsg" role="status" aria-live="polite"></p>';
    o.querySelector('#pcGoogleBtn').onclick=()=>window.pdIngresarConGoogle();
  }
  const MAPA='<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7l6-3 6 3 6-3v13l-6 3-6-3-6 3z"/><path d="M9 4v13M15 7v13"/></svg>';
  function locHTML(d){
    const on=d.lat!=null&&d.lng!=null;
    return '<div class="pcLoc'+(on?' on':'')+'"><i>'+IC.pin+'</i><span><b>'+(on?'Ubicación guardada':'Sin ubicación guardada')+'</b><small>'+(on?'<a href="https://www.google.com/maps?q='+d.lat+','+d.lng+'" target="_blank" rel="noopener">Ver en el mapa</a>':'Guárdala estando en tu casa u oficina.')+'</small></span></div>'+
      '<div class="pcLocBtns"><button type="button" class="pcBtn'+(on?' light':'')+'" data-acc="ubicar">'+IC.pin+(on?'Actualizar ubicación':'Usar mi ubicación actual')+'</button>'+'<button type="button" class="pcBtn light" data-acc="mapa">'+MAPA+'Marcar en el mapa</button>'+(on?'<button type="button" class="pcBtn light" data-acc="quitar">Quitar</button>':'')+'</div>';
  }
  function pintarPerfil(){
    vista='perfil';const o=overlay();if(!o)return;const u=usuario();if(!u)return pintarLogin();
    const m=u.user_metadata||{};const d=borrador||datos();borrador=d;
    const foto=m.avatar_url||m.picture||'';const ini=String(d.nombre||u.email||'C').trim().charAt(0).toUpperCase();
    o.querySelector('#pcTitulo').textContent='Mi perfil';
    o.querySelector('.pcBody').innerHTML='<div class="pcUser"><div class="pcAv">'+E(ini)+'</div><div><b>'+E(d.nombre||'Cliente Pidemás')+'</b><small>'+E(u.email||'')+'</small></div></div>'+
      '<div class="pcSec"><div class="pcSecT">'+IC.user+'Datos para tus pedidos</div><p class="pcSecS">Así te contactará el negocio y el motorizado.</p>'+
        '<label class="pcF"><span>Nombre completo</span><input id="pcNombre" autocomplete="name" value="'+E(d.nombre)+'"></label>'+
        '<label class="pcF"><span>Número de celular</span><input id="pcTel" type="tel" inputmode="tel" autocomplete="tel" placeholder="Ej. 987 654 321" value="'+E(d.telefono)+'"></label>'+
        '<label class="pcF"><span>Correo de contacto (opcional)</span><input id="pcCorreo" type="email" autocomplete="email" placeholder="'+E(u.email||'')+'" value="'+E(d.correo)+'"></label></div>'+
      '<div class="pcSec"><div class="pcSecT">'+IC.pin+'Dirección de entrega</div><p class="pcSecS">Se usará al confirmar tus pedidos. Puedes cambiarla en cada pedido.</p>'+
        '<label class="pcF"><span>Dirección</span><input id="pcDir" autocomplete="street-address" placeholder="Ej. Av. Grau 1234, Piura" value="'+E(d.direccion)+'"></label>'+
        '<label class="pcF"><span>Referencia</span><textarea id="pcRef" placeholder="Ej. Frente al parque, casa de portón negro">'+E(d.referencia)+'</textarea></label>'+
        '<div class="pcF" id="pcLocBox">'+locHTML(d)+'</div></div>';
    o.querySelector('.pcFoot').innerHTML='<p class="pcMsg" role="status" aria-live="polite"></p><button type="button" class="pcBtn big" data-acc="guardar">Guardar mis datos</button><button type="button" class="pcBtn big light" data-acc="salir">'+IC.out+'Cerrar sesión</button>';
    const sync=()=>{borrador={...borrador,nombre:$('pcNombre').value,telefono:$('pcTel').value,correo:$('pcCorreo').value,direccion:$('pcDir').value,referencia:$('pcRef').value}};
    o.querySelector('.pcBody').oninput=sync;
    o.querySelector('.pcSheet').onclick=async e=>{
      const b=e.target.closest('[data-acc]');if(!b)return;const a=b.dataset.acc;
      if(a==='ubicar'){sync();ubicar(b);return}
      if(a==='mapa'){sync();if(!window.pdMapaElegir)return;const c=(borrador.lat!=null&&borrador.lng!=null)?{lat:Number(borrador.lat),lng:Number(borrador.lng)}:null;const r=await window.pdMapaElegir({titulo:'Tu ubicación de entrega',icono:'ti-home',centro:c,tip:'Mueve el mapa hasta tu casa u oficina'});if(!r)return;borrador.lat=r.lat;borrador.lng=r.lng;if(!String(borrador.direccion||'').trim()&&r.linea){borrador.direccion=[r.linea,r.sub].filter(Boolean).join(', ');const di=$('pcDir');if(di)di.value=borrador.direccion}$('pcLocBox').innerHTML=locHTML(borrador);estadoLoc('Guardando ubicación…');try{await guardarUbicacion(r.lat,r.lng);estadoLoc('Ubicación guardada en tu cuenta. Se usará en tus pedidos.')}catch(err){estadoLoc('No se pudo guardar la ubicación: '+(err.message||'inténtalo de nuevo.'),true)}return}
      if(a==='quitar'){sync();borrador.lat=null;borrador.lng=null;$('pcLocBox').innerHTML=locHTML(borrador);try{await guardarUbicacion(null,null);estadoLoc('Ubicación quitada.')}catch(err){estadoLoc('No se pudo quitar: '+(err.message||''),true)}return}
      if(a==='guardar'){sync();guardar(b);return}
      if(a==='pedidos'){window.pdCerrarCuentaCliente();try{openOrderHistory()}catch(_){}return}
      if(a==='seguimiento'){window.pdCerrarCuentaCliente();try{openOrderTracking()}catch(_){}return}
      if(a==='salir'){if(!confirm('¿Cerrar sesión en este teléfono?'))return;try{const {error}=await sb.auth.signOut();if(error)throw error;borrador=null;window.pdActualizarCuentaCliente(null);msg('Sesión cerrada.',true)}catch(err){msg('No se pudo cerrar la sesión: '+(err.message||''))}}
    };
  }
  /* Pide la ubicación: primero con GPS preciso y, si tarda, con la ubicación aproximada del teléfono */
  function pedirUbicacion(){
    return new Promise((ok,mal)=>{
      if(!navigator.geolocation)return mal({code:0});
      navigator.geolocation.getCurrentPosition(ok,e=>{
        if(e&&e.code===1)return mal(e);
        navigator.geolocation.getCurrentPosition(ok,mal,{enableHighAccuracy:false,timeout:15000,maximumAge:120000});
      },{enableHighAccuracy:true,timeout:12000,maximumAge:0});
    });
  }
  function estadoLoc(txt,err){
    const box=$('pcLocBox');if(!box)return;
    let s=box.querySelector('.pcLocMsg');if(!s){s=document.createElement('p');s.className='pcLocMsg';box.appendChild(s)}
    s.textContent=txt||'';s.style.cssText='margin:8px 2px 0;font:600 13px Inter,system-ui,-apple-system,Roboto,Arial,sans-serif;color:'+(err?'var(--fr-red)':'#1F1A17');
  }
  async function guardarUbicacion(lat,lng){
    const u=usuario();
    LS.set({lat,lng});
    if(!u)return true;
    const {data:r,error}=await sb.auth.updateUser({data:{delivery_lat:lat,delivery_lng:lng}});
    if(error)throw error;
    try{pdClienteSesion=r.user||u}catch(_){}
    return true;
  }
  async function ubicar(btn){
    if(!navigator.geolocation){estadoLoc('Este teléfono no permite obtener la ubicación.',true);return}
    btn.disabled=true;estadoLoc('Buscando tu ubicación… puede tardar unos segundos.');msg('');
    try{
      const p=await pedirUbicacion();
      const lat=Number(p.coords.latitude.toFixed(7)),lng=Number(p.coords.longitude.toFixed(7));
      borrador.lat=lat;borrador.lng=lng;
      $('pcLocBox').innerHTML=locHTML(borrador);estadoLoc('Guardando ubicación…');
      /* Se guarda al momento: no hace falta tocar «Guardar mis datos» */
      await guardarUbicacion(lat,lng);
      estadoLoc('Ubicación guardada en tu cuenta. Se usará en tus pedidos.');
    }catch(e){
      btn.disabled=false;
      if(e&&e.code===1)estadoLoc('Chrome bloqueó tu ubicación. Toca el candado junto a la dirección de la página › Permisos › Ubicación › Permitir, y vuelve a intentarlo.',true);
      else if(e&&(e.code===2||e.code===3))estadoLoc('No se pudo obtener tu ubicación. Activa la ubicación (GPS) del teléfono y vuelve a intentarlo.',true);
      else estadoLoc('No se pudo guardar la ubicación: '+((e&&e.message)||'inténtalo de nuevo.'),true);
    }
  }
  async function guardar(btn){
    const d=borrador;
    if(!String(d.nombre||'').trim()){msg('Escribe tu nombre completo.');$('pcNombre').focus();return}
    const tel=String(d.telefono||'').replace(/\D/g,'');
    if(tel&&tel.length<9){msg('Revisa tu número de celular (9 dígitos).');$('pcTel').focus();return}
    btn.disabled=true;msg('Guardando…');
    const data={full_name:d.nombre.trim(),phone:String(d.telefono||'').trim(),contact_email:String(d.correo||'').trim(),address:String(d.direccion||'').trim(),address_reference:String(d.referencia||'').trim(),delivery_lat:d.lat,delivery_lng:d.lng};
    LS.set({nombre_cliente:data.full_name,telefono_cliente:data.phone,direccion:data.address,referencia:data.address_reference,lat:data.delivery_lat,lng:data.delivery_lng});
    try{const {data:r,error}=await sb.auth.updateUser({data});if(error)throw error;borrador=null;window.pdActualizarCuentaCliente(r.user||usuario());msg('Tus datos quedaron guardados. Se usarán en tus pedidos.',true)}
    catch(e){msg('Se guardó en este teléfono, pero no en tu cuenta: '+(e.message||'inténtalo de nuevo.'))}
    finally{btn.disabled=false}
  }
  /* ===== Volver a la misma carta después de entrar con Google ===== */
  const VK='pd_volver_carta';
  const negEnlace=()=>(new URLSearchParams(location.search).get('negocio')||'').trim();
  let cartaAbierta='';
  if(typeof window.showRestaurant==='function'){const o=window.showRestaurant;window.showRestaurant=function(id){cartaAbierta=String(id||'');return o.apply(this,arguments)}}
  if(typeof window.volverMenuPrincipal==='function'){const o=window.volverMenuPrincipal;window.volverMenuPrincipal=function(){if(!negEnlace())cartaAbierta='';return o.apply(this,arguments)}}
  /* Carta que el cliente tiene abierta ahora (por enlace, en la ventana de carta o en la vista de carta) */
  function cartaActual(){
    if(negEnlace())return negEnlace();
    const modal=document.getElementById('cartaModalNegocio');
    const abierta=(modal&&modal.innerHTML.trim()&&!modal.classList.contains('hidden'))||document.getElementById('products')?.classList.contains('menu-completo');
    if(!abierta)return '';
    if(cartaAbierta)return cartaAbierta;
    try{const n=(modal?.querySelector('h2')?.textContent||document.getElementById('productsTitle')?.textContent||'').trim().toLowerCase();const r=(restaurants||[]).find(x=>String(x.nombre||x.nombre_negocio||'').trim().toLowerCase()===n);return r?String(r.id):''}catch(_){return ''}
  }
  window.pdIngresarConGoogle=async function(){
    const b=$('pcGoogleBtn');if(b)b.disabled=true;msg('Conectando con Google…');
    try{
      const enlace=negEnlace(),id=enlace||cartaActual();
      try{if(id)localStorage.setItem(VK,JSON.stringify({id,enlace:!!enlace,t:Date.now()}));else localStorage.removeItem(VK)}catch(_){}
      /* Vuelve a la misma carta. El parámetro también evita que el navegador muestre una copia vieja de la tienda guardada en caché */
      const redirectTo=location.origin+location.pathname+(enlace?'?negocio='+encodeURIComponent(enlace)+'&v='+Date.now():'?v='+Date.now());
      const {error}=await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo,queryParams:{access_type:'offline',prompt:'select_account'}}});
      if(error)throw error;
    }catch(e){if(b)b.disabled=false;msg('No se pudo iniciar sesión: '+(e.message||'inténtalo de nuevo.'))}
  };
  (async function volverACarta(){
    let p=null;try{p=JSON.parse(localStorage.getItem(VK)||'null')}catch(_){}
    if(!p||!p.id)return;
    if(Date.now()-Number(p.t||0)>20*60*1000){try{localStorage.removeItem(VK)}catch(_){}return}
    /* Espera a que la sesión de Google quede lista antes de moverse */
    let ok=false;for(let i=0;i<80&&!ok;i++){try{const {data}=await sb.auth.getSession();ok=!!data?.session?.user}catch(_){}if(!ok)await new Promise(r=>setTimeout(r,250))}
    try{localStorage.removeItem(VK)}catch(_){}
    if(!ok)return;
    if(p.enlace){if(negEnlace()!==p.id)location.replace(location.pathname+'?negocio='+encodeURIComponent(p.id)+location.hash);return}
    if(negEnlace())return;
    const abrir=()=>{try{window.pdCerrarCuentaCliente&&window.pdCerrarCuentaCliente()}catch(_){}window.showRestaurant(p.id)};
    for(let i=0;i<80;i++){try{if(Array.isArray(restaurants)&&restaurants.some(r=>String(r.id)===String(p.id))){abrir();
      /* Si algo de la tienda la cerró al terminar de cargar, se vuelve a abrir una vez */
      setTimeout(()=>{if(!cartaActual())abrir()},2500);return}}catch(_){}await new Promise(r=>setTimeout(r,250))}
  })();
  /* Buscador: dentro de la carta de un negocio busca productos de esa carta */
  (function(){
    const s=document.getElementById('search');if(!s)return;
    const base=s.getAttribute('placeholder')||'Buscar negocios y productos...';
    const pintar=()=>{const enCarta=!!negEnlace()||!!cartaActual();const ph=enCarta?'Buscar productos en la carta':base;if(s.placeholder!==ph){s.placeholder=ph;s.setAttribute('aria-label',ph)}};
    pintar();setInterval(pintar,700);
    /* Búsqueda dentro de la carta abierta: solo productos de ese negocio */
    const norm=v=>String(v??'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
    s.addEventListener('input',e=>{
      const id=negEnlace()||cartaActual();if(!id)return;
      e.stopImmediatePropagation();
      const q=norm(s.value.trim());
      let todos=[];try{todos=(products||[]).filter(p=>p.origen==='negocio'&&String(p.negocio_id)===String(id))}catch(_){}
      const lista=q?todos.filter(p=>norm([p.nombre,p.nombre_producto,p.descripcion,p.categoria,p.categoria_nombre].join(' ')).includes(q)):todos;
      const el=document.getElementById('products');
      try{renderProducts(lista)}catch(_){}
      if(q&&!lista.length&&el)el.innerHTML='<div class="empty" style="padding:24px 8px;text-align:center;grid-column:1/-1">No encontramos «'+E(s.value.trim())+'» en esta carta.</div>';
      try{const r=(restaurants||[]).find(x=>String(x.id)===String(id));if(r&&document.getElementById('cartaModalProducts')&&typeof actualizarContenidoModalCarta==='function')actualizarContenidoModalCarta(r)}catch(_){}
    },true);
  })();
  /* Reemplaza las funciones de la cuenta de la tienda */
  window.pdAbrirCuentaCliente=function(){const o=overlay();if(!o)return;o.hidden=false;document.body.classList.add('pc-abierto');borrador=null;usuario()?pintarPerfil():pintarLogin()};
  window.pdCerrarCuentaCliente=function(){const o=$('pdGoogleAuthOverlay');if(o)o.hidden=true;document.body.classList.remove('pc-abierto')};
  window.pdMostrarPerfilCliente=function(){window.pdAbrirCuentaCliente()};
  const actualizarOriginal=window.pdActualizarCuentaCliente;
  window.pdActualizarCuentaCliente=function(user){
    try{pdClienteSesion=user||null}catch(e){}
    const btn=$('pdCustomerAccountBtn');
    if(btn){
      const m=(user&&user.user_metadata)||{},foto=m.avatar_url||m.picture||'';
      btn.classList.toggle('pdLogged',!!user);btn.title=user?(user.email||'Mi cuenta'):'Mi cuenta';
      btn.innerHTML=IC.user+(user?'<span class="pcOk" aria-hidden="true"></span>':'');btn.setAttribute('aria-label',user?'Mi perfil':'Iniciar sesión');
      if(!user){btn.style.color='#1F1A17'}
    }
    const o=$('pdGoogleAuthOverlay');
    if(o&&!o.hidden){if(user){if(vista!=='perfil')pintarPerfil()}else pintarLogin()}
  };
  try{window.pdActualizarCuentaCliente(pdClienteSesion)}catch(e){}
  const cssBtn=document.createElement('style');cssBtn.textContent='html body #pdCustomerAccountBtn#pdCustomerAccountBtn,html body #pdCustomerAccountBtn#pdCustomerAccountBtn.pdLogged{position:relative!important;flex:0 0 auto!important;width:44px!important;height:44px!important;min-width:44px!important;padding:0!important;border:1px solid var(--fr-line)!important;border-radius:14px!important;background:#FFFFFF!important;color:var(--fr-ink)!important;box-shadow:none!important;display:grid!important;place-items:center!important;overflow:visible!important}html body #pdCustomerAccountBtn svg{width:22px!important;height:22px!important;display:block!important}html body #pdCustomerAccountBtn .pcOk{position:absolute;top:-4px;right:-4px;width:14px;height:14px;border-radius:50%;background:var(--fr-ink);border:2px solid #FFFFFF}';document.head.appendChild(cssBtn);

  /* Al pedir, este teléfono recuerda también la dirección y la ubicación usadas */
  if(typeof window.saveCustomerInfo==='function'){
    window.saveCustomerInfo=function(name,tel){
      const v=id=>{const el=$(id);return el?String(el.value||'').trim():''};
      const o={nombre_cliente:name||'',telefono_cliente:tel||''};
      if(v('cDireccion'))o.direccion=v('cDireccion');if(v('cReferencia'))o.referencia=v('cReferencia');
      if(v('cLat')&&v('cLng')){o.lat=Number(v('cLat'));o.lng=Number(v('cLng'))}
      LS.set(o);
    };
  }
  /* Si el cliente toma su ubicación al pedir y aún no tenía una guardada, queda guardada en su cuenta */
  if(typeof window.useCurrentLocation==='function'){
    const o=window.useCurrentLocation;
    window.useCurrentLocation=function(){
      const out=o.apply(this,arguments);
      if(usuario()&&datos().lat==null){let n=0;const iv=setInterval(()=>{n++;const la=$('cLat')?.value,ln=$('cLng')?.value;if(la&&ln){clearInterval(iv);guardarUbicacion(Number(la),Number(ln)).catch(()=>{})}else if(n>40)clearInterval(iv)},500)}
      return out;
    };
  }
  /* Formulario de entrega: se llena con los datos y la ubicación guardados */
  const abrirCheckoutOriginal=window.openCheckout;
  if(typeof abrirCheckoutOriginal==='function'){
    window.openCheckout=function(){
      const out=abrirCheckoutOriginal.apply(this,arguments);
      try{
        const d=datos(),put=(id,v)=>{const el=$(id);if(el&&!String(el.value||'').trim()&&v)el.value=v};
        put('cNombre',d.nombre);put('cTelefono',d.telefono);put('cDireccion',d.direccion);put('cReferencia',d.referencia);
        if(d.lat!=null&&d.lng!=null&&$('cLat')&&!$('cLat').value){
          $('cLat').value=d.lat;$('cLng').value=d.lng;
          const st=$('cLocationStatus');if(st)st.textContent='Usando tu ubicación guardada.';
          const mp=$('cMapLink');if(mp)mp.innerHTML='<a href="https://www.google.com/maps?q='+d.lat+','+d.lng+'" target="_blank" rel="noopener" style="color:var(--fr-ink);font-weight:700">Ver en el mapa</a> · Si no estás ahí, toca «Usar mi ubicación actual».';
          try{updateDeliveryFarePreview()}catch(e){}
        }
        const sheet=$('cNombre')&&$('cNombre').closest('.sheet');
        if(sheet&&(d.nombre||d.direccion||d.lat!=null)&&!sheet.querySelector('.pcUsado')){
          const n=document.createElement('div');n.className='pcUsado';n.innerHTML='Completamos tus datos guardados. <b>Revísalos antes de enviar.</b>';
          const top=sheet.querySelector('.sheetTop');if(top)top.after(n);
        }
      }catch(e){console.warn('No se pudieron llenar los datos guardados',e)}
      return out;
    };
  }
})();

  const SVG=p=>'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+p+'</svg>';
  const IC={
    pin:SVG('<path d="M9 11a3 3 0 1 0 6 0a3 3 0 0 0 -6 0"/><path d="M17.66 16.66l-4.24 4.24a2 2 0 0 1 -2.83 0l-4.25 -4.24a8 8 0 1 1 11.32 0z"/>'),

  function tarjeta(icono,titulo,edit){

  }
  function negocioNombre(){
    try{const it=(cart||[]).find(x=>x.origen==='negocio');if(!it)return 'Productos Pidemás';const r=(restaurants||[]).find(x=>String(x.id)===String(it.negocio_id));return r?(r.nombre||r.nombre_negocio||''):''}catch(e){return ''}

  function rehacer(){

    if(top&&n&&!top.querySelector('.ckSub')){const h=top.querySelector('h2');if(h)h.insertAdjacentHTML('beforeend','<span class="ckSub">'+E(n)+'</span>')}
    const vacioDir=!String($('cDireccion')?.value||'').trim();

    const cards=document.createElement('div');cards.className='ckCards';
    (sheet.querySelector('#pdCkItems')||top).insertAdjacentElement(sheet.querySelector('#pdCkItems')?'beforebegin':'afterend',cards);

    const cE=tarjeta(IC.pin,'Entregar en','Cambiar');const bE=cE.querySelector('.ckBody');

      const fb=$('deliveryFareBox');if(fb){const tx=fb.textContent||'';const ok=/Delivery\s*S\//.test(tx)&&!/aproximada/i.test(tx);const f=fb.closest('.field');if(f)f.style.display=ok?'none':''}

  async function marcarEnMapa(pintar){

<script id="pidemas-carta-app-js">

/* «Pedido en curso» de la portada: usa los mismos pedidos de la cuenta que el Seguimiento,
   así nunca muestra un pedido que el seguimiento no tiene (por ejemplo, uno ya entregado) */
(function(){
  const FIN=['entregado','cancelado','anulado','rechazado'];
  let corriendo=false;
  async function sincronizar(){
    if(corriendo)return;corriendo=true;
    try{
      let uid=null;try{uid=pdClienteSesion&&pdClienteSesion.id}catch(e){}
      if(!uid||typeof sb==='undefined'||!sb.from)return;
      const {data,error}=await sb.from('pedidos').select('id,estado,negocio_id,total,metodo_pago,creado_en,pago_confirmado').eq('cliente_auth_id',uid).order('creado_en',{ascending:false}).limit(20);
      if(error)return;
      const act=(data||[]).find(x=>!FIN.includes(String(x.estado||'').toLowerCase()));
      let prev=null;try{prev=JSON.parse(localStorage.getItem('pidemas_last_order')||'null')}catch(e){}
      if(act)localStorage.setItem('pidemas_last_order',JSON.stringify(Object.assign({},prev&&String(prev.id)===String(act.id)?prev:{},act)));
      else localStorage.removeItem('pidemas_last_order');
      try{window.pdRenderActiveOrder&&window.pdRenderActiveOrder()}catch(e){}
    }catch(e){}finally{corriendo=false}
  }
  window.pdSincronizarPedidoEnCurso=sincronizar;
  setTimeout(sincronizar,1500);setInterval(()=>{if(!document.hidden)sincronizar()},20000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)sincronizar()});
  /* Al abrir el seguimiento también se actualiza la portada */
  const t=setInterval(()=>{if(typeof window.openOrderTracking!=='function'||window.openOrderTracking.__pdSync)return;clearInterval(t);const f=window.openOrderTracking;window.openOrderTracking=async function(){const r=await f.apply(this,arguments);sincronizar();return r};window.openOrderTracking.__pdSync=true},400);
})();

  function conteos(){const c={};let l=[];try{l=restaurants||[]}catch(e){}l.forEach(r=>{let k='';try{k=normalizeBusinessCategory(r)}catch(e){k=r.categoria_negocio||''}c[k]=(c[k]||0)+1});return {c,total:l.length}}
  function filtros(){

  function aplicarAbiertos(){
    const box=$('restaurants');if(!box)return;let vis=0;
    const cards=[...box.querySelectorAll(':scope>.restaurant')];const dist=c=>{const d=c.querySelector('.restaurantDistance');return d?parseFloat(d.textContent):NaN};

<script id="pidemas-tienda-buscador-js">
(function(){
  const E=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const norm=v=>String(v??'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,' ').trim();
  const nombre=r=>String(r.nombre||r.nombre_negocio||r.razon_social||'Negocio');
  const cat=r=>String(r.categoria_negocio||r.categoria||'');
  const lista=()=>{try{return Array.isArray(restaurants)?restaurants:[]}catch(e){return []}};
  const enCarta=()=>{try{if(new URLSearchParams(location.search).get('negocio'))return true}catch(e){}try{return typeof cartaActual==='function'&&!!cartaActual()}catch(e){return false}};
  /* Coincide si el nombre contiene lo escrito, o si cada palabra escrita empieza alguna palabra del nombre */
  function puntaje(r,q){
    const n=norm(nombre(r)),c=norm(cat(r));if(!q)return 0;
    if(n.startsWith(q))return 3;
    if(n.includes(q))return 2;
    const pal=q.split(' '),ws=(n+' '+c).split(' ');
    if(pal.every(p=>ws.some(w=>w.startsWith(p))))return 1;
    if(c.includes(q))return .5;
    return 0;
  }
  function resaltar(txt,q){const n=norm(txt),i=n.indexOf(q);if(!q||i<0)return E(txt);return E(txt.slice(0,i))+'<mark>'+E(txt.slice(i,i+q.length))+'</mark>'+E(txt.slice(i+q.length))}
  function abierto(r){try{return typeof isRestaurantOpen==='function'?!!isRestaurantOpen(r):null}catch(e){return null}}
  let box=null;
  function cerrar(){if(box)box.hidden=true}
  function abrir(id){cerrar();const s=document.getElementById('search');if(s)s.blur();try{window.showRestaurant(id)}catch(e){}}
  function pintar(){
    const s=document.getElementById('search');if(!s)return;
    const cont=s.closest('.piBuscar')||s.parentElement;
    if(!box){box=document.createElement('div');box.id='piSug';box.hidden=true;box.setAttribute('role','listbox');
      box.addEventListener('mousedown',e=>e.preventDefault());
      box.addEventListener('click',e=>{const b=e.target.closest('button[data-id]');if(b)abrir(b.dataset.id)})}
    if(box.parentElement!==cont)cont.appendChild(box);
    const q=norm(s.value);
    if(!q||enCarta()||document.activeElement!==s){cerrar();return}
    const L=lista().map(r=>({r,p:puntaje(r,q)})).filter(x=>x.p>0).sort((a,b)=>b.p-a.p||nombre(a.r).localeCompare(nombre(b.r))).slice(0,6);
    box.innerHTML='<span class="k">Negocios</span>'+(L.length?L.map(({r})=>{const a=abierto(r),logo=r.logo_url||r.logo||r.imagen_url||'';
      return `<button type="button" role="option" data-id="${E(r.id)}"><span class="av">${logo?`<img src="${E(logo)}" alt="">`:E(nombre(r).trim()[0]||'N')}</span><span class="tx"><b>${resaltar(nombre(r),q)}</b>${cat(r)?`<small>${E(cat(r))}</small>`:''}</span>${a===null?'':`<span class="st ${a?'on':''}">${a?'Abierto':'Cerrado'}</span>`}</button>`}).join(''):'<div class="nada">No hay negocios con ese nombre. Sigue escribiendo o busca un producto.</div>');
    box.hidden=false;
  }
  function montar(){
    const s=document.getElementById('search');if(!s||s.dataset.piSug)return;s.dataset.piSug='1';
    s.setAttribute('autocomplete','off');
    s.addEventListener('input',pintar);s.addEventListener('focus',pintar);
    s.addEventListener('blur',()=>setTimeout(cerrar,150));
    s.addEventListener('keydown',e=>{if(e.key==='Escape')cerrar();if(e.key==='Enter'&&box&&!box.hidden){const b=box.querySelector('button[data-id]');if(b){e.preventDefault();abrir(b.dataset.id)}}});
  }
  document.addEventListener('click',e=>{if(box&&!box.hidden&&!e.target.closest('#piSug,.piBuscar'))cerrar()});
  setInterval(montar,600);montar();
})();
</script>

<script id="pidemas-tienda-horario-js">
(function(){
  const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const SV=p=>'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+p+'</svg>';
  const IC={
    reloj:SV('<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'),
    alerta:SV('<circle cx="12" cy="12" r="9"/><path d="M12 7v5"/><path d="M12 16h.01"/>'),
    abre:SV('<path d="M3 21h18"/><path d="M5 21V8l7-4 7 4v13"/><path d="M10 21v-6h4v6"/>'),
    candado:SV('<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>'),
    info:SV('<circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><path d="M12 8h.01"/>')
  };
  const DIAS=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
  const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
  const hora=m=>{m=((m%1440)+1440)%1440;const h=Math.floor(m/60),mi=m%60,ap=h>=12?'pm':'am',h12=h%12||12;return h12+(mi?':'+String(mi).padStart(2,'0'):'')+' '+ap};
  const rango=r=>hora(r.open)+' – '+hora(r.close);
  const horarioDe=r=>{try{return pick(r,['horario','horarios','horario_atencion','horario_atencion_negocio'],'')}catch(e){return r&&r.horario||''}};
  const nombreDe=r=>{try{return pick(r,['nombre','nombre_negocio','razon_social'],'Negocio')}catch(e){return r&&r.nombre||'Negocio'}};
  const rests=()=>{try{return restaurants||[]}catch(e){return []}};
  const ahora=()=>{try{return getLimaNow()}catch(e){return new Date()}};
  const dia=(h,d)=>{try{return window.getDailySchedule(h,d)}catch(e){return null}};
  const minAhora=n=>n.getHours()*60+n.getMinutes();
  const enMin=m=>m<60?m+' min':(Math.floor(m/60)+' h'+(m%60?' '+(m%60)+' min':''));

  /* Estado actual del negocio */
  function estado(r){
    const h=horarioDe(r),n=ahora(),cur=minAhora(n);
    let abierto=false;try{abierto=isRestaurantOpen(r)}catch(e){}
    if(!String(h).trim())return {tipo:'off',pill:'Sin horario',txt:'Este negocio todavía no registró su horario.'};
    if(abierto){
      const hoy=dia(h,n);let falta=hoy?hoy.close-cur:null;if(hoy&&hoy.open>hoy.close&&cur>=hoy.open)falta=1440-cur+hoy.close;
      if(falta!=null&&falta<=30)return {tipo:'warn',pill:'Cierra pronto',txt:'Recibe pedidos hasta las '+hora(hoy.close)+' (en '+enMin(falta)+').'};
      return {tipo:'on',pill:'Abierto',txt:hoy?'Recibe pedidos hasta las '+hora(hoy.close)+'.':'Recibe pedidos ahora.'};
    }
    for(let d=0;d<=7;d++){
      const f=new Date(n);f.setDate(f.getDate()+d);const r2=dia(h,f);if(!r2)continue;
      if(d===0&&r2.open<=cur)continue;
      const falta=d===0?r2.open-cur:null;
      const cuando=d===0?'hoy':d===1?'mañana':'el '+DIAS[f.getDay()];
      if(falta!=null&&falta<=60)return {tipo:'warn',pill:'Abre pronto',txt:'Abre hoy a las '+hora(r2.open)+' (en '+enMin(falta)+').'};
      return {tipo:'off',pill:'Cerrado',txt:'Abre '+cuando+' a las '+hora(r2.open)+'.'};
    }
    return {tipo:'off',pill:'Cerrado',txt:'No tiene días de atención registrados.'};
  }
  window.pdEstadoHorario=estado;

  /* Hoja de horario */
  window.showRestaurantSchedule=function(id){
    const r=rests().find(x=>String(x.id)===String(id));if(!r)return;
    const h=horarioDe(r),n=ahora(),st=estado(r);
    const logo=r.logo_url||r.logo||r.imagen_logo_url||'';const nom=nombreDe(r);
    const lunes=new Date(n);lunes.setDate(n.getDate()-((n.getDay()+6)%7));

    for(let i=0;i<7;i++){
      const f=new Date(lunes);f.setDate(lunes.getDate()+i);const rg=dia(h,f);const esHoy=f.getDay()===n.getDay();
      filas+='<div class="phDia'+(esHoy?' hoy':'')+(rg?'':' cerr')+'"><span>'+cap(DIAS[f.getDay()])+(esHoy?'<i class="tag">Hoy</i>':'')+'</span><em>'+(rg?rango(rg):'Cerrado')+'</em></div>';
    }
    let corte='Estos horarios ya incluyen el horario de atención de Pidemás.';try{const sem=window.pdHorarioSemana&&pdHorarioSemana();if(sem){const no=sem.filter(x=>!x.activo).map(x=>x.dia.toLowerCase());if(no.length)corte='Estos horarios ya incluyen el horario de atención de Pidemás. Pidemás no atiende '+(no.length===1?'los '+no[0]+'s':'los días: '+no.join(', '))+'.'}}catch(e){}
    const enCarta=(()=>{try{return document.getElementById('products')?.classList.contains('menu-completo')&&String(currentNegocioId||'')===String(r.id)}catch(e){return false}})()||!!document.querySelector('#cartaModalNegocio:not(.hidden) .carta-modal-body');
    showModal('<div class="sheet scheduleSheet phSheet"><div class="phTop"><span class="phLogo">'+(logo?'<img src="'+E(logo)+'" alt="" onerror="this.parentElement.textContent=\''+E(nom.charAt(0).toUpperCase())+'\'">':E(nom.charAt(0).toUpperCase()))+'</span><span class="phTit"><small>Horario de atención</small><b>'+E(nom)+'</b></span><button type="button" class="phX close" onclick="closeModal()" aria-label="Cerrar">×</button></div>'+
      '<div class="phBody"><div class="phEst '+st.tipo+'"><span class="ic">'+(st.tipo==='on'?IC.reloj:st.tipo==='warn'?IC.alerta:IC.candado)+'</span><span><b>'+(st.tipo==='on'?'Abierto ahora':st.tipo==='warn'?st.pill:'Cerrado ahora')+'</b><span>'+E(st.txt)+'</span></span></div>'+
      '<div class="phSem"><h3>Esta semana</h3>'+filas+'</div>'+
      (corte?'<div class="phNota">'+IC.info+'<span>'+E(corte)+'</span></div>':'')+'</div>'+
      '<div class="phFoot"><button type="button" class="phGo" onclick="'+(enCarta?'closeModal()':'closeModal();showRestaurant(\''+E(String(r.id))+'\')')+'">'+(enCarta?'Volver a la carta':'Ver la carta')+'</button></div></div>');
  };

  /* Aviso flotante: abre pronto / cierra pronto / cerrado */

    else if(/está cerrado/i.test(t)){tipo='off';ic=IC.candado;tit=(nom||'El negocio')+' está cerrado';const st=r?estado(r):null;cuerpo='Tu pedido no puede enviarse ahora. '+(st?st.txt:'Vuelve cuando abra.');if(r)acc=[['Ver horario','dk',()=>window.showRestaurantSchedule(r.id)]]}
    else if(/Pidemás (recibe pedidos|no atiende)/i.test(t)){tipo='off';ic=IC.candado;tit=/no atiende/i.test(t)?'Hoy no atendemos':'Fuera de horario';cuerpo=t}

  };
  function cerrar(){const b=document.getElementById('horarioAlert');if(b)b.classList.remove('show');clearTimeout(tAviso)}

<script id="pidemas-programar-js">

  const p2=n=>String(n).padStart(2,'0');
  const abiertoPidemas=()=>{try{return typeof pdServicioAbierto==='function'?pdServicioAbierto():true}catch(e){return true}};

  /* ---------- Modo programado ---------- */
  function leer(){try{const v=JSON.parse(sessionStorage.getItem('pd_prog')||'null');if(v&&v.iso&&new Date(v.iso).getTime()>Date.now()){const f=new Date(v.y,v.mo,v.d,v.h,v.mi,0,0);return {...v,fecha:f}}}catch(e){}return null}
  window.__pdProg=leer();window.__pdProgNegId=window.__pdProg?window.__pdProg.neg||null:null;
  function fijar(v){window.__pdProg=v;if(!v)window.__pdProgNegId=null;try{if(v)sessionStorage.setItem('pd_prog',JSON.stringify({...v,fecha:undefined}));else sessionStorage.removeItem('pd_prog')}catch(e){}refrescar()}
  window.pdCancelarProgramado=()=>fijar(null);
  /* Los negocios se ven abiertos o cerrados según la hora programada */
  const orig=window.isRestaurantOpen;
  if(typeof orig==='function')window.isRestaurantOpen=function(r,ref){return orig.call(this,r,ref||(window.__pdProg?window.__pdProg.fecha:null))};
  function refrescar(){
    document.body.classList.toggle('pp-prog',!!window.__pdProg);
    try{refreshRestaurantStatuses()}catch(e){}try{renderRestaurants()}catch(e){}
    banner();
  }
  function banner(){
    let b=$('ppBanner');const v=window.__pdProg;
    if(!v){if(b)b.hidden=true;return}
    if(!b){b=document.createElement('div');b.id='ppBanner';b.addEventListener('click',e=>{const a=e.target.closest('[data-a]');if(!a)return;if(a.dataset.a==='cambiar')abrirSlots();if(a.dataset.a==='quitar')fijar(null)})}
    const hd=document.querySelector('.app>header');if(hd&&b.previousElementSibling!==hd)hd.insertAdjacentElement('afterend',b);else if(!hd&&!b.parentElement)document.body.prepend(b);
    b.hidden=false;b.innerHTML=CAL+'<span><b>Pedido programado</b><small>'+E(v.txt)+'</small></span><button type="button" data-a="cambiar">Cambiar</button><button type="button" data-a="quitar" aria-label="Quitar">×</button>';
  }


  /* ---------- Horario de cada negocio: solo se puede reservar dentro de su jornada ---------- */
  const HKEYS=['horario','horarios','horario_atencion','horario_atencion_negocio'];
  function negociosCtx(){
    try{
      if(typeof cart==='undefined'||!Array.isArray(cart)||!cart.length||typeof restaurants==='undefined')return [];
      const ids=[...new Set(cart.map(x=>String(x.negocio_id||'')).filter(Boolean))];
      return ids.map(id=>restaurants.find(r=>String(r.id)===id)).filter(Boolean);
    }catch(e){return []}
  }
  /* Negocios para los que se reserva: los del carrito o, si está vacío, el negocio desde el que se pidió reservar */
  function negociosReserva(){
    const c=negociosCtx();if(c.length)return c;
    try{const id=window.__pdProgNegId;if(!id||typeof restaurants==='undefined')return [];const r=restaurants.find(x=>String(x.id)===String(id));return r?[r]:[]}catch(e){return []}
  }
  const nomNeg=r=>{try{return pick(r,['nombre','nombre_negocio','razon_social'],'El negocio')}catch(e){return 'El negocio'}};
  const horNeg=r=>{try{return String(pick(r,HKEYS,'')||'').trim()}catch(e){return ''}};
  function rangoNeg(r,f){const h=horNeg(r);if(!h)return undefined;try{return getDailySchedule(h,f)||null}catch(e){return undefined}}
  function dentroUno(r,f,m){
    const g=rangoNeg(r,f);if(g===undefined)return true;if(g===null)return false;
    const x=((m%1440)+1440)%1440;
    if(g.open<g.close)return x>=g.open&&x<g.close;
    if(g.open>g.close)return x>=g.open||x<g.close;
    return true;
  }
  const dentroNeg=(f,m)=>negociosReserva().every(r=>dentroUno(r,f,m));
  window.pdAtiendeEn=(r,f)=>dentroUno(r,f,f.getHours()*60+f.getMinutes());
  window.pdRangoNeg=rangoNeg;

  /* ---------- Horarios disponibles ---------- */
  function diasDisponibles(){
    const out=[],n=lima(),cur=n.getHours()*60+n.getMinutes();
    for(let i=0;i<=7&&out.length<7;i++){
      const f=new Date(n);f.setDate(n.getDate()+i);f.setHours(12,0,0,0);
      const h=window.pdHorarioDia?pdHorarioDia(f):{abre:540,ultimo:1290};if(!h)continue;
      let ini=h.abre;if(i===0)ini=Math.max(ini,Math.ceil((cur+45)/30)*30);
      const slots0=[];for(let m=Math.ceil(ini/30)*30;m<=h.ultimo;m+=30)slots0.push(m);
      const slots=slots0.filter(m=>dentroNeg(f,m));
      if(!slots.length)continue;
      const et=i===0?'Hoy':i===1?'Mañana':DIAS[f.getDay()].charAt(0).toUpperCase()+DIAS[f.getDay()].slice(1);
      out.push({f,slots,et,sub:f.getDate()+' '+MES[f.getMonth()],dia:DIAS[f.getDay()]});
    }
    return out;
  }
  let selD=0,selH=null,lista=[];
  function abrirSlots(){
    lista=diasDisponibles();if(!lista.length){const _ng=negociosReserva();const _t=_ng.length?nomNeg(_ng[0])+' no tiene horarios disponibles para reservar en los próximos 7 días.':'No hay horarios disponibles para reservar en los próximos días.';try{if(typeof mostrarAvisoHorario==='function')mostrarAvisoHorario(_t);else toast(_t)}catch(e){alert(_t)}return}
    const v=window.__pdProg;selD=0;selH=null;
    if(v){const k=lista.findIndex(d=>d.f.toDateString()===v.fecha.toDateString());if(k>=0){selD=k;selH=v.h*60+v.mi;if(!lista[k].slots.includes(selH))selH=null}}
    let m=$('ppSlots');
    if(!m){m=document.createElement('div');m.id='ppSlots';document.body.appendChild(m);m.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;
      if(a==='x'){m.hidden=true;if(!window.__pdProg)window.__pdProgNegId=null}
      if(a==='dia'){selD=+b.dataset.i;selH=null;pintar()}
      if(a==='hora'){selH=+b.dataset.m;pintar()}
      if(a==='ok'&&selH!=null){const d=lista[selD];const f=new Date(d.f);f.setHours(Math.floor(selH/60),selH%60,0,0);
        const iso=f.getFullYear()+'-'+p2(f.getMonth()+1)+'-'+p2(f.getDate())+'T'+p2(f.getHours())+':'+p2(f.getMinutes())+':00-05:00';
        const txt=(d.et==='Hoy'?'hoy':d.et==='Mañana'?'mañana '+d.dia:d.dia)+' '+d.sub+', '+hora(selH);
        const abs=d.dia+' '+d.sub+', '+hora(selH);
        m.hidden=true;$('ppCerrado')&&($('ppCerrado').hidden=true);
        fijar({neg:window.__pdProgNegId||null,iso,txt,abs,y:f.getFullYear(),mo:f.getMonth(),d:f.getDate(),h:f.getHours(),mi:f.getMinutes(),fecha:f});
        const _rn=negociosReserva();
        if(_rn.length&&!negociosCtx().length){try{toast('Listo, reservaste para '+txt+(/\.$/.test(txt)?'':'.')+' Ahora elige tus productos de '+nomNeg(_rn[0])+'.')}catch(e){}try{closeModal()}catch(e){}try{window.showRestaurant(_rn[0].id)}catch(e){}}
        else{try{toast(_rn.length?'Listo, tu pedido queda reservado para '+txt:'Listo, reservaste para '+txt+(/\.$/.test(txt)?'':'.')+' Ahora elige un negocio y arma tu pedido.')}catch(e){}}
      }})}
    m.hidden=false;pintar();
  }
  function pintar(){
    const m=$('ppSlots');if(!m)return;const d=lista[selD];
    /* se recuerda el desplazamiento para que al elegir un cajón la pantalla no salte */
    const _bd=m.querySelector('.bd'),_di=m.querySelector('.dias'),_ho=m.querySelector('.horas'),_st=_bd?_bd.scrollTop:0,_sl=_di?_di.scrollLeft:0,_re=!!_bd;
    const RELOJ='<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';
    const _nh=negociosReserva().map(r=>{const g=rangoNeg(r,d.f);return g?'<div class="nhi">'+RELOJ+'<span><b>'+E(nomNeg(r))+'</b><small>Atiende de '+hora(g.open)+' a '+hora(g.close)+'</small></span></div>':''}).join('');
    const _hrs='<div class="hg"><div class="hgr">'+d.slots.map(s=>'<button type="button" data-a="hora" data-m="'+s+'" class="'+(s===selH?'on':'')+'">'+hora(s)+'</button>').join('')+'</div></div>';
    const _dias=lista.map((x,i)=>{const lab=(x.et==='Hoy'||x.et==='Mañana')?x.et:x.et.slice(0,3);return '<button type="button" data-a="dia" data-i="'+i+'" class="'+(i===selD?'on':'')+'"><i>'+E(lab)+'</i><b>'+x.f.getDate()+'</b><small>'+E(String(x.sub).split(' ')[1]||'')+'</small></button>'}).join('');
    m.innerHTML='<div class="bg" data-a="x"></div><div class="s"><div class="hd"><span class="ico">'+CAL+'</span><span class="tt"><b>Programar pedido</b><small>Elige cuándo quieres recibirlo</small></span><button type="button" class="x" data-a="x" aria-label="Cerrar">×</button></div><div class="bd">'+(_nh?'<div class="nh">'+_nh+'</div>':'')+
      '<div class="lb"><span class="n">'+CAL+'</span><span class="t"><b>Elige el día</b><small>Hasta 7 días de anticipación</small></span><span class="pill">Paso 1 de 2</span></div><div class="dias">'+_dias+'</div>'+
      '<div class="lb"><span class="n">'+RELOJ+'</span><span class="t"><b>Elige la hora de entrega</b><small>Es una hora aproximada</small></span><span class="pill">Paso 2 de 2</span></div><div class="horas">'+_hrs+'</div></div>'+
      '<div class="ft"><div class="sum'+(selH==null?' vacio':'')+'">'+CAL+'<span><small>Tu reserva</small><b>'+(selH==null?'Elige una hora para continuar':E(d.et+', '+d.sub+' · '+hora(selH)))+'</b></span></div><button type="button" class="bt dk" data-a="ok"'+(selH==null?' disabled':'')+'>'+(selH==null?'Elige una hora':'Confirmar reserva')+'</button></div></div>';
    if(_re){const sh=m.querySelector('.s');if(sh)sh.style.animation='none';const bd=m.querySelector('.bd'),di=m.querySelector('.dias');if(bd)bd.scrollTop=_st;if(di)di.scrollLeft=_sl}
  }
  window.pdProgramarPedido=abrirSlots;

  /* ---------- Pantalla «Estamos cerrados» ---------- */
  function semana(){
    const s=window.pdHorarioSemana?pdHorarioSemana():[];const hoy=DIAS[lima().getDay()].normalize('NFD').replace(/[̀-ͯ]/g,'');
    const h12=v=>{const m=String(v||'').match(/(\d{1,2}):(\d{2})/);return m?hora(+m[1]*60+(+m[2])):v};
    const fil=[];s.forEach(x=>{const k=x.dia.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');const val=x.activo?h12(x.abre)+' – '+h12(x.ultimo):'Cerrado';const last=fil[fil.length-1];
      if(last&&last.val===val&&!last.hoy&&k!==hoy){last.hasta=x.dia}else fil.push({desde:x.dia,hasta:null,val,hoy:k===hoy,off:!x.activo})});
    return fil.map(r=>'<div class="'+(r.hoy?'hoy':'')+'"><span>'+E(r.desde+(r.hasta?' a '+r.hasta.toLowerCase():''))+(r.hoy?' · hoy':'')+'</span><span class="'+(r.off?'off':'')+'">'+E(r.val)+'</span></div>').join('');
  }
  function pantalla(){
    if(abiertoPidemas()||window.__pdProg){const c=$('ppCerrado');if(c)c.hidden=true;return}
    const clave='pp_visto_'+lima().toDateString();let visto=false;try{visto=sessionStorage.getItem(clave)==='1'}catch(e){}
    let c=$('ppCerrado');
    if(!c){c=document.createElement('div');c.id='ppCerrado';document.body.appendChild(c);c.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;
      if(b.dataset.a==='ver'){c.hidden=true;try{sessionStorage.setItem(clave,'1')}catch(_){}}
      if(b.dataset.a==='prog'){try{sessionStorage.setItem(clave,'1')}catch(_){}abrirSlots()}})}
    document.body.classList.add('ppCerradoVisto');
    if(visto){c.hidden=true;return}
    const p=window.pdHorario&&pdHorario.proxima();const logo=document.querySelector('.pidemas-header-logo')?.getAttribute('src')||'';
    const html='<div class="in">'+(logo?'<div class="logo"><img src="'+logo+'" alt="Pidemás Delivery"></div>':'')+'<div class="luna">'+LUNA+'</div><h1>Estamos cerrados</h1>'+
      '<p class="vuelve">'+(p?'Volvemos a recibir pedidos<br><b>'+E(p.cuando+(p.cuando==='mañana'?' '+DIAS[(lima().getDay()+1)%7]:'')+' a las '+p.hora)+'</b>':'Por ahora no estamos recibiendo pedidos.')+'</p>'+
      '<div class="sem">'+semana()+'</div>'+
      '<button type="button" class="bt dk" data-a="prog">'+CAL+'Programar un pedido</button>'+
      '<button type="button" class="bt lt" data-a="ver">Ver los negocios igual</button>'+
      '<p class="nota">Puedes ver las cartas ahora. Para pedir, programa tu entrega y la enviamos apenas abramos.</p></div>';
    if(c.dataset.h!==html){c.innerHTML=html;c.dataset.h=html}
    c.hidden=false;
  }
  /* ---------- En «Tu pedido» se muestra la hora programada ---------- */
  function checkout(){
    const sh=document.querySelector('#modal .sheet.pdCkV2');if(!sh)return;let k=sh.querySelector('.ppCk');const v=window.__pdProg;
    if(!v){k?.remove();return}
    if(!k){k=document.createElement('div');k.className='ppCk';const ref=sh.querySelector('.ckBody,.ckCard')?.closest('.ckCard')||sh.children[1];(ref?ref.parentElement:sh).insertBefore(k,ref||null);k.addEventListener('click',e=>{if(e.target.closest('button'))abrirSlots()})}
    let fu='';try{const bad=negociosReserva().find(r=>!dentroUno(r,v.fecha,v.h*60+v.mi));if(bad)fu=nomNeg(bad)+' no atiende a esa hora'}catch(e){}
    const h='<svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3v4M16 3v4M4 10h16"/></svg><span><b>'+(fu?'Revisa el horario':'Entrega programada')+'</b><small>'+E(fu||v.txt)+'</small></span><button type="button">Cambiar</button>';
    if(k.dataset.h!==h){k.innerHTML=h;k.dataset.h=h}
    const btn=sh.querySelector('button.primary[onclick*="submitCartOrder"] span');if(btn&&/Confirmar pedido/.test(btn.textContent))btn.textContent='Programar pedido';
  }
  /* Al terminar el pedido se sale del modo programado */
  const sub=window.submitCartOrder;
  if(typeof sub==='function')window.submitCartOrder=async function(){const v=window.__pdProg;const r=await sub.apply(this,arguments);
    try{const t=$('modal')?.innerText||'';if(v&&/enviado|registrado/i.test(t)){const s=document.querySelector('#modal .sheet');if(s&&!s.querySelector('.ppOk')){const d=document.createElement('div');d.className='ppCk ppOk';d.style.margin='12px 0';d.innerHTML=CAL+'<span><b>Pedido programado</b><small>Para '+E(v.txt)+(String(v.txt||'').endsWith('.')?'':'.')+' El negocio lo verá y lo preparará para esa hora.</small></span>';const h2=s.querySelector('h2,.sheetTop');(h2&&h2.parentElement===s?h2:s.firstElementChild).insertAdjacentElement('afterend',d)}fijar(null)}}catch(e){}
    return r};
  window.pdProgMarca=()=>window.__pdProg?{iso:window.__pdProg.iso,txt:window.__pdProg.abs||window.__pdProg.txt}:null;
  function todo(){try{pantalla();banner();checkout()}catch(e){}}
  setTimeout(()=>{refrescar();todo()},600);setInterval(todo,1500);
  new MutationObserver(()=>{clearTimeout(todo.t);todo.t=setTimeout(checkout,60)}).observe(document.documentElement,{childList:true,subtree:true});
})();
</script>






<!-- ===== Pidemás · Tienda: reservar solo dentro del horario de atención de cada negocio ===== -->
<style id="pidemas-reserva-btn-css">
html body #modal .phSheet .phFoot .pdResBtn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 48px; margin: 0px 0px 10px; padding: 0px 16px; border: 1.5px solid var(--fr-orange); border-radius: 16px; background: rgb(255, 255, 255); color: var(--fr-orange); font: 800 15px Inter, system-ui, -apple-system, Roboto, Arial, sans-serif; cursor: pointer; }
html body #modal .phSheet .phFoot .pdResBtn svg { width: 18px; height: 18px; flex: 0 0 18px; }
html body #modal .phSheet .phFoot .pdResBtn:active { background: var(--fr-peach-soft); }
</style>

<script id="pidemas-reserva-horario-js">
(function(){
  const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const CAL='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3v4M16 3v4M4 10h16"/></svg>';
  const hora=m=>{m=((m%1440)+1440)%1440;const h=Math.floor(m/60),mi=m%60;return (h%12||12)+':'+String(mi).padStart(2,'0')+' '+(h>=12?'p. m.':'a. m.')};
  const lima=()=>{try{return getLimaNow()}catch(e){return new Date()}};
  const rests=()=>{try{return restaurants||[]}catch(e){return []}};
  const nom=r=>{try{return pick(r,['nombre','nombre_negocio','razon_social'],'El negocio')}catch(e){return 'El negocio'}};
  const prog=()=>window.__pdProg||null;
  const DSEM=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'],MESES=['ene','feb','mar','abr','may','jun','jul','ago','set','oct','nov','dic'];
  /* «Hoy, sáb 7 nov · 9:00 a. m.» */
  function cuando(v){const f=v.fecha,n=lima();const a=new Date(n);a.setHours(0,0,0,0);const b=new Date(f);b.setHours(0,0,0,0);const dd=Math.round((b-a)/864e5);
    const dia=dd===0?'Hoy':dd===1?'Mañana':DSEM[f.getDay()];return dia+' '+f.getDate()+' '+MESES[f.getMonth()]+' · '+hora(f.getHours()*60+f.getMinutes())}
  const fin=t=>/\.$/.test(t)?t:t+'.';
  function rangoCorto(r,f){try{const g=window.pdRangoNeg&&window.pdRangoNeg(r,f);return g?'Ese día atiende de '+hora(g.open)+' a '+hora(g.close):'Ese día no atiende'}catch(e){return ''}}
  /* ¿El negocio atiende a la hora reservada? */
  function atiende(r,f){try{return typeof window.pdAtiendeEn==='function'?window.pdAtiendeEn(r,f):true}catch(e){return true}}
  /* ¿Tiene algún horario libre para reservar en los próximos días? (abierto ahora no cuenta) */
  function abiertoAhora(r){try{const f=lima();return atiende(r,f)&&(typeof pdServicioAbierto!=='function'||pdServicioAbierto())}catch(e){return false}}
  function reservarPara(id){
    window.__pdProgNegId=String(id);
    try{closeModal()}catch(e){}
    if(typeof window.pdProgramarPedido==='function')window.pdProgramarPedido();
  }
  window.pdReservarNegocio=reservarPara;

  /* En modo reserva, el estado del negocio se describe según la hora reservada */
  const estOrig=window.pdEstadoHorario;
  if(typeof estOrig==='function')window.pdEstadoHorario=function(r){
    const v=prog();if(!v||!r)return estOrig.apply(this,arguments);
    return atiende(r,v.fecha)
      ?{tipo:'on',pill:'Atiende a esa hora',tit:'Atiende en tu reserva',txt:cuando(v)}
      :{tipo:'off',pill:'No atiende a esa hora',tit:'No atiende a la hora de tu reserva',txt:'Tu reserva: '+cuando(v)+'\n'+fin(rangoCorto(r,v.fecha))};
  };

  /* Hoja de horario: aviso claro y botón para reservar dentro de su horario */
  const schOrig=window.showRestaurantSchedule;
  if(typeof schOrig==='function')window.showRestaurantSchedule=function(id){
    const out=schOrig.apply(this,arguments);
    try{
      const r=rests().find(x=>String(x.id)===String(id));if(!r)return out;
      const sh=document.querySelector('#modal .phSheet');if(!sh)return out;
      const v=prog();const foot=sh.querySelector('.phFoot');
      if(v&&atiende(r,v.fecha)){
        const est=sh.querySelector('.phEst');
        if(est){est.className='phEst on';est.innerHTML='<span class="ic">'+CAL+'</span><span><b>Atiende en tu reserva</b><span>'+E(cuando(v))+'</span></span>'}
      }
      if(v&&!atiende(r,v.fecha)){
        const est=sh.querySelector('.phEst');
        if(est){est.className='phEst off';est.innerHTML='<span class="ic">'+CAL+'</span><span><b>No atiende a la hora de tu reserva</b><span>'+E('Tu reserva: '+cuando(v)+'\n'+fin(rangoCorto(r,v.fecha))+' Elige otra hora.')+'</span></span>'}
        if(foot&&!foot.querySelector('.pdResBtn'))foot.insertAdjacentHTML('afterbegin','<button type="button" class="pdResBtn">'+CAL+' Cambiar la hora de reserva</button>');
      }else if(!v&&!abiertoAhora(r)){
        if(foot&&!foot.querySelector('.pdResBtn'))foot.insertAdjacentHTML('afterbegin','<button type="button" class="pdResBtn">'+CAL+' Reservar para cuando atienda</button>');
      }
      const b=foot&&foot.querySelector('.pdResBtn');if(b)b.onclick=e=>{e.preventDefault();reservarPara(r.id)};
    }catch(e){console.warn('[Pidemás] reserva',e)}
    return out;
  };

  /* Último control antes de enviar: la hora reservada debe estar dentro del horario del negocio */
  const subOrig=window.submitCartOrder;
  if(typeof subOrig==='function')window.submitCartOrder=async function(){
    const v=prog();
    if(v){
      try{
        if(v.fecha.getTime()<=lima().getTime()+15*60000){
          const t='La hora de tu reserva ('+cuando(v)+') ya pasó o está muy cerca. Elige otra hora.';
          try{mostrarAvisoHorario?mostrarAvisoHorario(t):toast(t)}catch(e){}
          if(typeof window.pdProgramarPedido==='function')window.pdProgramarPedido();return;
        }
        const ids=[...new Set((cart||[]).map(x=>String(x.negocio_id||'')).filter(Boolean))];
        const bad=ids.map(id=>rests().find(r=>String(r.id)===id)).filter(Boolean).find(r=>!atiende(r,v.fecha));

<script id="pidemas-boton-atras">
(function(){
  if(window.__pdAtras)return;window.__pdAtras=true;
  const CIERRES='.pdCerrarX,[data-a="x"],[data-a="cerrar"],[data-close],.m-x,.h-x,.phX,.pdtX,.x,.close,.pcX,[aria-label^="Cerrar"],[aria-label^="Volver"]';
  const IGNORAR='header,nav,#nav,.bottom,#horarioAlert,#pdAvisoMoto,#toast,.toast,#pdxAlerts,.x-alert,#pdHorarioBar,#pcaBar,#pdCartaCartBar';
  const visible=el=>{if(!el||!el.isConnected)return false;const cs=getComputedStyle(el);if(cs.display==='none'||cs.visibility==='hidden'||Number(cs.opacity)===0)return false;const r=el.getBoundingClientRect();return r.width>0&&r.height>0};
  /* Ventanas abiertas: elementos fijos que tapan buena parte de la pantalla */
  function abiertas(){
    const W=innerWidth,H=innerHeight,out=[];
    document.querySelectorAll('body *').forEach(el=>{
      if(el.closest(IGNORAR))return;
      const cs=getComputedStyle(el);if(cs.position!=='fixed')return;
      if(!visible(el))return;const r=el.getBoundingClientRect();
      const area=Math.max(0,Math.min(r.right,W)-Math.max(r.left,0))*Math.max(0,Math.min(r.bottom,H)-Math.max(r.top,0));
      if(area<W*H*0.45)return;
      if(out.some(o=>o.contains(el)))return;
      for(let i=out.length-1;i>=0;i--)if(el.contains(out[i]))out.splice(i,1);
      out.push(el);
    });
    /* niveles extra que define cada panel (por ejemplo, una pestaña que no es la principal) */
    const extra=typeof window.pdAtrasExtra==='function'?(window.pdAtrasExtra()||0):0;
    return {lista:out,nivel:out.length+extra,extra};
  }
  const z=el=>{let n=0,x=el;while(x&&x!==document.body){const v=parseInt(getComputedStyle(x).zIndex,10);if(!isNaN(v))n=Math.max(n,v);x=x.parentElement}return n};
  function cerrarArriba(){
    const {lista,extra}=abiertas();
    if(!lista.length){if(extra&&typeof window.pdAtrasVolver==='function'){window.pdAtrasVolver();return true}return false}
    /* se cierra la ventana que se abrió de último; si no se sabe, la que está más arriba */
    const ultima=pila.slice().reverse().find(el=>lista.includes(el));
    const orden=lista.slice().sort((a,b)=>z(b)-z(a)||(a.compareDocumentPosition(b)&Node.DOCUMENT_POSITION_FOLLOWING?1:-1));
    const top=ultima||orden[0];
    const btn=[...top.querySelectorAll(CIERRES)].find(b=>visible(b)&&!b.disabled)||[...top.querySelectorAll('button')].find(b=>visible(b)&&/^[×✕✖]$/.test(b.textContent.trim()));
    if(btn){btn.click();return true}
    if(top.tagName==='BUTTON'){top.click();return true}
    document.dispatchEvent(new KeyboardEvent('keydown',{key:'Escape',bubbles:true}));
    setTimeout(()=>{if(top.isConnected&&visible(top)){if('hidden' in top)top.hidden=true}},120);
    return true;
  }
  let puestos=0,ignorar=0,pila=[];
  try{history.replaceState(Object.assign({},history.state||{},{pdBase:true}),'')}catch(e){}
  function sync(ya){
    const ab=abiertas(),n=ab.nivel;
    pila=pila.filter(el=>ab.lista.includes(el));ab.lista.forEach(el=>{if(!pila.includes(el))pila.push(el)});
    if(n>puestos){for(let i=puestos;i<n;i++){try{history.pushState({pdNivel:i+1},'')}catch(e){}}puestos=n}
    else if(n<puestos){
      /* solo se retrocede si la ventana sigue cerrada un momento después (evita saltos cuando la lista se vuelve a dibujar) */
      clearTimeout(sync.t);const bajar=()=>{const m=abiertas().nivel;if(m<puestos){const d=puestos-m;puestos=m;ignorar++;try{history.go(-d)}catch(e){ignorar--}}};if(ya)bajar();else sync.t=setTimeout(bajar,600);
    }
  }
  addEventListener('popstate',()=>{
    if(ignorar>0){ignorar--;return}
    if(puestos>0){puestos--;const antes=abiertas().nivel;cerrarArriba();
      setTimeout(()=>{const ahora=abiertas().nivel;if(ahora>=antes&&ahora>0){try{history.pushState({pdNivel:puestos+1},'')}catch(e){}puestos++}else sync(true)},350)}
  });
  let t=null;const prog=()=>{clearTimeout(t);t=setTimeout(sync,150)};
  new MutationObserver(prog).observe(document.documentElement,{childList:true,subtree:true,attributes:true,attributeFilter:['class','hidden','style','open']});
  setInterval(sync,1500);
  window.pdAtrasDebug=()=>({puestos,nivel:abiertas().nivel,lista:abiertas().lista.map(e=>e.id||e.className)});
})();
</script>
<script id="pidemas-version">
/* Si el servidor ya tiene una versión más nueva de esta página, se recarga sola con la nueva (evita ver una versión guardada vieja). */
(function(){
  const V='20261106213000',K='pd_ver_'+location.pathname;
  async function revisar(){
    try{
      if(location.protocol==='file:')return;
      if(window.pdAtrasDebug&&pdAtrasDebug().nivel>0)return;            // no recargar con una ventana abierta
      const a=document.activeElement;if(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))return; // ni mientras escribe
      const r=await fetch(location.pathname+'?chk='+Date.now(),{cache:'no-store'});if(!r.ok)return;
      const m=(await r.text()).match(/name="pd-version" content="([^"]+)"/);
      if(!m||m[1]===V)return;
      if(sessionStorage.getItem(K)===m[1])return;sessionStorage.setItem(K,m[1]);
      const u=new URL(location.href);u.searchParams.set('v',m[1]);location.replace(u.toString());
    }catch(e){}
  }
  setTimeout(revisar,2500);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)revisar()});
  setInterval(revisar,5*60*1000);
})();
</script>















<script id="pd-solo-x">
(function(){
  /* Las ventanas solo se cierran con la X: tocar el fondo no hace nada */
  var FONDOS='#modal,.carta-modal-overlay,#pdGoogleAuthOverlay,#modal .bg,.pdOverlay';
  function esFondo(t){return t&&t.matches&&t.matches(FONDOS)}
  ['click','pointerup','mouseup','touchend'].forEach(function(ev){
    document.addEventListener(ev,function(e){
      if(esFondo(e.target)){e.stopImmediatePropagation();e.preventDefault()}
    },true);
  });
  /* Sin zoom: pellizcar, doble toque, gestos de Safari y Ctrl+rueda */
  ['gesturestart','gesturechange','gestureend'].forEach(function(ev){document.addEventListener(ev,function(e){e.preventDefault()},{passive:false})});
  document.addEventListener('touchmove',function(e){if(e.touches&&e.touches.length>1&&e.cancelable)e.preventDefault()},{passive:false,capture:true});
  var ult=0;
  document.addEventListener('touchend',function(e){var n=Date.now();if(n-ult<350&&e.cancelable&&!(e.target.closest&&e.target.closest('input,textarea,select,a,button,label')))e.preventDefault();ult=n},{passive:false});
  document.addEventListener('wheel',function(e){if(e.ctrlKey)e.preventDefault()},{passive:false});
  document.addEventListener('keydown',function(e){if((e.ctrlKey||e.metaKey)&&(e.key==='+'||e.key==='-'||e.key==='='||e.key==='0'))e.preventDefault()});
  /* Sin recargar al arrastrar hacia abajo (en la página y en las ventanas) */
  var y0=0,x0=0;
  document.addEventListener('touchstart',function(e){if(e.touches.length===1){y0=e.touches[0].clientY;x0=e.touches[0].clientX}},{passive:true,capture:true});
  document.addEventListener('touchmove',function(e){
    if(e.touches.length!==1)return;
    var t=e.target;if(!t||!t.closest)return;
    var dy=e.touches[0].clientY-y0,dx=e.touches[0].clientX-x0;
    if(Math.abs(dx)>Math.abs(dy))return; /* gesto horizontal: carruseles y chips siguen funcionando */
    if(t.closest('input,textarea,select,[contenteditable="true"],iframe,.leaflet-container'))return;
    var sc=t,ok=false;
    while(sc&&sc!==document.documentElement){
      var cs=getComputedStyle(sc);
      if(/(auto|scroll)/.test(cs.overflowY)&&sc.scrollHeight>sc.clientHeight+1){
        if(dy>0&&sc.scrollTop>0)ok=true;
        if(dy<0&&sc.scrollTop+sc.clientHeight<sc.scrollHeight-1)ok=true;
        if(ok)break;
      }
      sc=sc.parentElement;
    }
    if(!ok){
      var se=document.scrollingElement||document.documentElement;
      if(dy>0&&se.scrollTop>0&&!t.closest('#modal,.carta-modal-overlay,#pdGoogleAuthOverlay'))ok=true;
      if(dy<0&&se.scrollTop+se.clientHeight<se.scrollHeight-1&&!t.closest('#modal,.carta-modal-overlay,#pdGoogleAuthOverlay'))ok=true;
    }
    /* Solo se bloquea el jalón hacia abajo estando arriba del todo (evita recargar). Nunca se bloquea el scroll normal. */
    /* El jalón hacia abajo ya no se bloquea por JS: lo evita overscroll-behavior-y en el CSS final, así el scroll nunca se corta. */
  },{passive:false,capture:true});
})();
</script>

<script id="pidemas-app-sw">
/* App instalable: registra el service worker (funciona en GitHub Pages y en cualquier hosting con https) */
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){

<script id="pd-efectos-js">
/* Pidemás · efectos de app profesional:
   - al agregar al carrito: el producto vuela al carrito, el carrito salta y el teléfono vibra suave
   - el botón «Agregar» muestra un visto ✓
   - la barra «Ver carrito» entra deslizándose y el total cambia con animación
   - los avisos entran suaves, el corazón de favoritos late y el pedido enviado se celebra con confeti */
(function(){
  if(window.__pdEfectos)return;window.__pdEfectos=true;
  const quieto=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const vibrar=ms=>{try{if(navigator.vibrate)navigator.vibrate(ms)}catch(e){}};
  const visible=el=>{if(!el)return false;const r=el.getBoundingClientRect();return r.width>0&&r.height>0&&!el.hidden&&getComputedStyle(el).visibility!=='hidden'};
  const pop=(el,cls)=>{if(!el||quieto)return;el.classList.remove(cls);void el.offsetWidth;el.classList.add(cls);setTimeout(()=>el.classList.remove(cls),600)};

  /* Último toque: de dónde sale el vuelo */
  let toque=null;
  document.addEventListener('pointerdown',e=>{
    const b=e.target.closest('button,[role=button],.productDetailCard,.pdRestCard,a');
    if(!b)return;
    const r=b.getBoundingClientRect();
    const caja=b.closest('.sheet,.productDetailCard,[class*="pdt"],.carta-modal-body')||b.parentElement;
    const img=caja&&caja.querySelector('img[src]:not([src^="data:image/svg"])');
    toque={x:r.left+r.width/2,y:r.top+r.height/2,img:img&&img.naturalWidth?img.currentSrc||img.src:null,boton:b,t:Date.now()};
  },true);

  const totalCarrito=()=>{try{return (window.cart||cart||[]).reduce((a,x)=>a+Number(x.cantidad||0),0)}catch(e){return 0}};
  const subtotal=()=>{try{return (window.cart||cart||[]).reduce((a,x)=>a+Number(x.precio||0)*Number(x.cantidad||0),0)}catch(e){return 0}};

  function destino(){
    const bar=document.getElementById('pdCartaCartBar');
    if(visible(bar))return bar.querySelector('.pdCartaCartCount')||bar;
    const btn=document.querySelector('header .cartBtn');
    if(visible(btn))return btn;
    const nav=[...document.querySelectorAll('.navbtn,nav button')].find(x=>/carrito|pedido/i.test(x.textContent));
    return visible(nav)?nav:null;
  }

  function volar(desde,img,cant){
    const meta=destino();if(!meta){return}
    const r=meta.getBoundingClientRect();const x2=r.left+r.width/2,y2=r.top+r.height/2;
    const x1=desde.x,y1=desde.y;
    if(quieto){llegar(meta);return}
    const f=document.createElement('div');f.className='pdfxVuelo';
    if(img)f.style.backgroundImage='url("'+img.replace(/"/g,'%22')+'")';else f.textContent='+'+cant;
    document.body.appendChild(f);
    const alto=Math.min(y1,y2)-Math.max(90,Math.abs(x2-x1)*0.35);
    const pasos=[];for(let i=0;i<=12;i++){const t=i/12;const x=x1+(x2-x1)*t;const y=(1-t)*(1-t)*y1+2*(1-t)*t*alto+t*t*y2;
      pasos.push({transform:'translate('+x+'px,'+y+'px) scale('+(1-0.55*t)+')'+(img?' rotate('+(t*200)+'deg)':''),opacity:t>0.92?0.2:1})}
    const a=f.animate(pasos,{duration:640,easing:'cubic-bezier(.35,.05,.45,1)',fill:'forwards'});
    a.onfinish=()=>{f.remove();llegar(meta)};
    setTimeout(()=>f.remove(),1500);
  }
  function llegar(meta){
    pop(meta,'pdfxPop');
    const badge=document.getElementById('cartCount');if(badge&&!meta.contains(badge))pop(badge,'pdfxPop');
    vibrar(18);
  }

  /* Visto ✓ en el botón Agregar */
  function vistoBien(b){
    if(!b||quieto||!document.body.contains(b))return;
    if(getComputedStyle(b).position==='static')b.style.position='relative';
    const o=document.createElement('span');o.className='pdfxOk';
    o.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>Agregado';
    b.appendChild(o);setTimeout(()=>o.remove(),900);
  }

  /* Total de la barra «Ver carrito» contando hacia el nuevo valor */
  function contar(desde,hasta){
    const bar=document.getElementById('pdCartaCartBar');if(!bar||quieto)return;
    const el=bar.lastElementChild;if(!el||!/S\//.test(el.textContent))return;
    const t0=performance.now(),d=420;
    (function paso(t){const k=Math.min(1,(t-t0)/d),e=1-Math.pow(1-k,3);el.textContent='S/ '+(desde+(hasta-desde)*e).toFixed(2);if(k<1)requestAnimationFrame(paso)})(t0);
  }

  /* Se engancha a updateCart: cada vez que el carrito crece, hay efecto */
  let antes=null,antesTotal=0,barraVisible=false;
  function enganchar(){
    const orig=window.updateCart;if(typeof orig!=='function'||orig.__pdfx)return false;
    const nuevo=function(){
      const prev=antes,prevTotal=antesTotal;
      const out=orig.apply(this,arguments);
      try{
        const n=totalCarrito(),tot=subtotal();antes=n;antesTotal=tot;
        const bar=document.getElementById('pdCartaCartBar');const vb=visible(bar);
        if(vb&&!barraVisible&&!quieto)pop(bar,'pdfxSube');
        barraVisible=vb;
        if(prev!==null&&n>prev){
          const d=toque&&Date.now()-toque.t<4000?toque:{x:innerWidth/2,y:innerHeight*0.7,img:null};
          const btn=d.boton;
          requestAnimationFrame(()=>{volar(d,d.img,n-prev);if(btn&&/agregar|añadir|\+/i.test(btn.textContent||btn.getAttribute('aria-label')||''))vistoBien(btn)});
          if(vb&&prevTotal!==tot)setTimeout(()=>contar(prevTotal,tot),60);
        }else if(prev!==null&&n<prev){pop(document.getElementById('cartCount'),'pdfxBump');vibrar(8)}
      }catch(e){}
      return out;
    };
    nuevo.__pdfx=true;window.updateCart=nuevo;
    try{updateCart=nuevo}catch(e){}
    antes=totalCarrito();antesTotal=subtotal();
    return true;
  }
  if(!enganchar())window.addEventListener('load',enganchar);

  /* Avisos (toast) entran suaves */
  const toast=document.getElementById('toast');
  if(toast&&!quieto){
    let mostrado=false;
    new MutationObserver(()=>{const v=toast.style.display!=='none'&&toast.textContent.trim();if(v&&!mostrado){toast.classList.remove('pdfxEntra');void toast.offsetWidth;toast.classList.add('pdfxEntra')}mostrado=!!v}).observe(toast,{attributes:true,attributeFilter:['style'],childList:true,characterData:true,subtree:true});
  }

  /* Corazón de favoritos late */
  document.addEventListener('click',e=>{const f=e.target.closest('.pdFav');if(!f)return;const oc=f.getAttribute('onclick');vibrar(10);
    setTimeout(()=>{const b=f.isConnected?f:[...document.querySelectorAll('.pdFav')].find(x=>x.getAttribute('onclick')===oc);pop(b,'pdfxPop')},30)},true);

  /* Pedido enviado: confeti */
  function confeti(){
    if(quieto)return;
    const c=document.createElement('canvas');c.className='pdfxConfeti';const dpr=Math.min(2,devicePixelRatio||1);
    c.width=innerWidth*dpr;c.height=innerHeight*dpr;document.body.appendChild(c);const g=c.getContext('2d');g.scale(dpr,dpr);
    const col=['#C4410C','#FF5E29','#FBE6DD','#1F6B3B','#F2B33D','#ffffff'];
    const P=[...Array(110)].map(()=>({x:innerWidth/2+(Math.random()-.5)*60,y:innerHeight*0.38,vx:(Math.random()-.5)*11,vy:-Math.random()*13-4,r:Math.random()*6+4,c:col[Math.random()*col.length|0],a:Math.random()*6,va:(Math.random()-.5)*.4}));
    const t0=performance.now();
    (function cuadro(t){g.clearRect(0,0,innerWidth,innerHeight);const k=(t-t0)/1000;
      P.forEach(p=>{p.vy+=0.38;p.vx*=0.985;p.x+=p.vx;p.y+=p.vy;p.a+=p.va;g.save();g.globalAlpha=Math.max(0,1-k/2.2);g.translate(p.x,p.y);g.rotate(p.a);g.fillStyle=p.c;g.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);g.restore()});
      if(k<2.3)requestAnimationFrame(cuadro);else c.remove()})(t0);
    vibrar([20,40,30]);
  }
  const modal=document.getElementById('modal');
  if(modal)new MutationObserver(()=>{const ok=modal.querySelector('.pdOkSheet:not([data-pdfx])');if(ok){ok.dataset.pdfx='1';setTimeout(confeti,120)}}).observe(modal,{childList:true,subtree:true});
})();
</script>
<script id="pd-pulido-js">
/* Pidemás · pulido de app: cuadros de carga, fotos que aparecen suave, seguimiento animado y hojas que se cierran deslizando */
(function(){
  if(window.__pdPulido)return;window.__pdPulido=true;
  const quieto=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const vibrar=ms=>{try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}};

  /* 1 · Cuadros de carga mientras llegan los negocios */
  const sk='<div class="pdSkCard" aria-hidden="true"><i></i><div><b></b><u></u><s></s></div></div>';
  function cargando(id,n){const el=document.getElementById(id);if(!el)return;if(el.querySelector('.restaurant,.product,.pdRestCard,.empty'))return;if(el.textContent.trim())return;el.innerHTML=sk.repeat(n);el.setAttribute('aria-busy','true');if(el.style.display==='none'){el.style.display='';el.dataset.pdSkOculto='1'}
    new MutationObserver((m,o)=>{if(!el.querySelector('.pdSkCard')){el.removeAttribute('aria-busy');o.disconnect()}}).observe(el,{childList:true})}
  cargando('restaurants',4);
  window.pdCuadrosCarga=cargando;

  /* Fotos que aparecen suave */
  function suave(img){if(img.__pdImg||img.complete||!img.closest('.restaurant,.product,.productDetailCard,.carta-modal-sheet,.sheet'))return;img.__pdImg=1;img.classList.add('pdImgEspera');
    const listo=()=>{img.classList.remove('pdImgEspera');img.classList.add('pdImgLista')};img.addEventListener('load',listo,{once:true});img.addEventListener('error',listo,{once:true});setTimeout(listo,3000)}
  if(!quieto)new MutationObserver(ms=>{for(const m of ms)for(const n of m.addedNodes){if(n.nodeType!==1)continue;if(n.tagName==='IMG')suave(n);else n.querySelectorAll&&n.querySelectorAll('img').forEach(suave)}}).observe(document.body,{childList:true,subtree:true});

  /* 4 · Seguimiento: cuando cambia el estado, el título entra, la barra avanza y el celular vibra */
  let estadoAntes=null;
  function revisarEstado(){
    const h=document.querySelector('#modal .pdpHero h3');const badge=document.querySelector('#pdActiveOrder');
    const txt=(h&&h.textContent.trim())||(badge&&badge.textContent.replace(/\s+/g,' ').trim())||null;
    if(txt&&estadoAntes&&txt!==estadoAntes&&!txt.startsWith(estadoAntes.slice(0,6))){
      const hero=document.querySelector('#modal .pdpHero');if(hero&&!quieto){hero.classList.remove('pdCambio');void hero.offsetWidth;hero.classList.add('pdCambio')}
      vibrar([30,60,30]);
    }
    if(txt)estadoAntes=txt;
  }
  let tEst=null;new MutationObserver(()=>{clearTimeout(tEst);tEst=setTimeout(revisarEstado,120)}).observe(document.body,{childList:true,subtree:true,characterData:true});

  /* 7 · Hojas que se cierran deslizando hacia abajo */
  const HOJAS='#modal .sheet,.carta-modal-sheet,.pcSheet';
  const CERRAR='.pdpX,.pcaX,.pdtX,.carta-modal-close,.pcX,button.close,[aria-label^="Cerrar"]';
  function cerrarHoja(h){const b=[...h.querySelectorAll(CERRAR)].find(x=>x.offsetParent!==null);if(b){b.click();return true}
    if(h.closest('#modal')&&typeof closeModal==='function'){closeModal();return true}if(h.classList.contains('carta-modal-sheet')&&typeof cerrarModalCarta==='function'){cerrarModalCarta();return true}return false}
  function desplazado(t,h){for(let e=t;e&&e!==h.parentElement;e=e.parentElement){if(e.scrollTop>0)return true;if(e===h)break}return false}
  let g=null;
  function inicio(x,y,t){
    if(quieto)return;const h=t.closest&&t.closest(HOJAS);if(!h)return;
    if(t.closest('input,textarea,select,[contenteditable],.pdpTabs,.pcaChips,.pvChips,[class*="Chips"]'))return;
    if(desplazado(t,h))return;
    g={h,x0:x,y0:y,dy:0,t0:Date.now(),activo:false};
  }
  function mover(x,y,ev){
    if(!g)return;const dx=x-g.x0,dy=y-g.y0;
    if(!g.activo){if(Math.abs(dy)<10&&Math.abs(dx)<10)return;if(dy<=0||Math.abs(dx)>Math.abs(dy)){g=null;return}g.activo=true;g.h.classList.add('pdArrastrando')}
    g.dy=Math.max(0,dy);const ahora=Date.now();g.v=(g.dy-(g.dyAnt||0))/Math.max(1,ahora-(g.tAnt||g.t0));g.dyAnt=g.dy;g.tAnt=ahora;
    g.h.style.setProperty('translate','0 '+(g.dy<120?g.dy:120+(g.dy-120)*0.85)+'px','important');
    if(ev&&ev.cancelable)ev.preventDefault();
  }
  function fin(){
    if(!g)return;const s=g;g=null;if(!s.activo)return;
    const v=(Date.now()-(s.tAnt||0))<90?(s.v||0):0;const h=s.h;h.classList.remove('pdArrastrando');h.classList.add('pdSoltando');
    if(s.dy>110||(v>0.55&&s.dy>40)){
      h.style.setProperty('translate','0 '+(h.offsetHeight+40)+'px','important');vibrar(8);
      setTimeout(()=>{cerrarHoja(h);setTimeout(()=>{h.style.removeProperty('translate');h.classList.remove('pdSoltando')},60)},230);
    }else{h.style.setProperty('translate','0 0px','important');setTimeout(()=>{h.style.removeProperty('translate');h.classList.remove('pdSoltando')},300)}
    /* evita que el final del arrastre cuente como toque en un botón */
    const anular=e=>{if(!e.isTrusted)return;e.stopPropagation();e.preventDefault();window.removeEventListener('click',anular,true)};window.addEventListener('click',anular,true);setTimeout(()=>window.removeEventListener('click',anular,true),350);
  }
  document.addEventListener('touchstart',e=>{if(e.touches.length===1)inicio(e.touches[0].clientX,e.touches[0].clientY,e.target)},{passive:true});
  document.addEventListener('touchmove',e=>{if(g&&e.touches.length===1)mover(e.touches[0].clientX,e.touches[0].clientY,e)},{passive:false});
  document.addEventListener('touchend',fin);document.addEventListener('touchcancel',fin);
  document.addEventListener('mousedown',e=>{if(e.button===0)inicio(e.clientX,e.clientY,e.target)});
  document.addEventListener('mousemove',e=>{if(g)mover(e.clientX,e.clientY,e)});
  document.addEventListener('mouseup',fin);
})();
</script>
