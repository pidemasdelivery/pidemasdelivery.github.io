    box.innerHTML=`<div class="pdLine"><span>Subtotal</span><span>${money(sub)}</span></div>
      <div class="pdLine"><span>Delivery${Number.isFinite(km)&&km>0?' · '+km.toFixed(1)+' km':''}</span><span>${dOrig>0?money(dOrig):'Por calcular'}</span></div>
      ${disc>0?`<div class="pdLine"><span>Descuento</span><span>− ${money(disc)}</span></div>`:''}
      ${pay==='efectivo'&&Number.isFinite(monto)&&monto>0?`<div class="pdLine"><span>Pagas con · tu cambio</span><strong>${money(monto)} · ${escH(cambio)}</strong></div>`:''}
      <div class="pdTotal"><span>Total a pagar</span><strong>${money(tot)}</strong></div>`;
    const btn=document.querySelector('#modal .sheet button.primary[onclick*="submitCartOrder"]');
    if(btn&&!btn.disabled&&!/Enviando/i.test(btn.textContent))btn.innerHTML=`<span>Confirmar pedido</span><span>${money(tot)}</span>`;
  }
  window.pdRefreshCheckoutSummary=refreshSummary;
  function enhance(){
    const modal=document.getElementById('modal');const nombre=document.getElementById('cNombre');
    if(!modal||!nombre)return;const sheet=nombre.closest('.sheet');if(!sheet||sheet.dataset.pdCk)return;
    sheet.dataset.pdCk='1';sheet.classList.add('pdCheckout');
    const h2=sheet.querySelector('.sheetTop h2');if(h2)h2.textContent='Tu pedido';
    const top=sheet.querySelector('.sheetTop');
    const items=document.createElement('div');items.className='pdCkBlock';items.id='pdCkItems';
    items.innerHTML=`<div class="pdKicker">Productos</div><div id="pdCkList">${itemsHtml()}</div>`;
    top.insertAdjacentElement('afterend',items);
    const k1=document.createElement('div');k1.className='pdKicker pdCkKicker';k1.textContent='Datos de entrega';
    nombre.closest('.field').insertAdjacentElement('beforebegin',k1);
    const sel=document.getElementById('cPago');const selField=sel?.closest('.field');
    if(selField){
      const k2=document.createElement('div');k2.className='pdKicker pdCkKicker';k2.textContent='Pago';
      const disc=document.getElementById('cDiscountCode')?.closest('.field');
      (disc||selField).insertAdjacentElement('beforebegin',k2);
      selField.classList.add('pdCkPayField');sel.classList.add('pdCkHiddenSelect');
      const seg=document.createElement('div');seg.className='pdCkSeg';seg.setAttribute('role','group');seg.setAttribute('aria-label','Método de pago');
      seg.innerHTML=[...sel.options].filter(o=>o.value).map(o=>`<button type="button" data-pay="${escH(o.value)}" aria-pressed="${sel.value===o.value}">${escH(o.textContent)}</button>`).join('');
      sel.insertAdjacentElement('afterend',seg);
      seg.addEventListener('click',e=>{const b=e.target.closest('[data-pay]');if(!b)return;sel.value=b.dataset.pay;seg.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));sel.dispatchEvent(new Event('change',{bubbles:true}));refreshSummary();});
    }
    // Evitar montos repetidos en la caja de efectivo: el resumen general los muestra.
    ['cMontoSubtotal','cMontoDelivery','cMontoPedido'].forEach(id=>{const el=document.getElementById(id);if(el){el.style.display='none';const lab=el.previousElementSibling;if(lab)lab.style.display='none';}});
    const btn=sheet.querySelector('button.primary[onclick*="submitCartOrder"]');
    if(btn){
      const sum=document.createElement('div');sum.className='pdPayBox pdCkSummary';sum.id='pdCkSummary';
      btn.insertAdjacentElement('beforebegin',sum);
      const wrap=document.createElement('div');wrap.className='pdCkSubmit';btn.insertAdjacentElement('beforebegin',wrap);wrap.appendChild(btn);
    }
    items.addEventListener('click',e=>{
      const b=e.target.closest('[data-ck-step]');if(!b)return;
      const i=Number(b.dataset.ckI),d=Number(b.dataset.ckStep);const it=cart[i];if(!it)return;
      if(d>0){const p=(typeof products!=='undefined'?products:[]).find(x=>String(x.id)===String(it.id)&&x.origen===it.origen);const st=Number(p?.stock);if(Number.isFinite(st)&&st>=0&&it.cantidad+1>st){toast('No hay suficiente stock disponible de este producto.');return;}}
      it.cantidad+=d;if(it.cantidad<=0)cart.splice(i,1);
      saveCart();updateCart();
      if(!cart.length){closeModal();toast('Tu carrito está vacío.');return;}
      document.getElementById('pdCkList').innerHTML=itemsHtml();
      updatePaymentAmounts();
    });
    refreshSummary();
  }
  function wrap(name,after){const f=window[name];if(typeof f!=='function'||f.__pdWrapped)return;const w=function(){const r=f.apply(this,arguments);try{after();}catch(e){console.warn(e)}return r;};w.__pdWrapped=true;window[name]=w;}
  function install(){
    wrap('openCheckout',enhance);
    wrap('updatePaymentAmounts',refreshSummary);
    wrap('updateCashChange',refreshSummary);
    wrap('renderDeliveryBox',refreshSummary);
  }
  install();
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',install,{once:true});
})();
</script>




<script id="pidemas-extras-tienda">
(function(){
  const LS={get(k,d){try{const v=JSON.parse(localStorage.getItem(k)||'null');return v==null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
  const escH=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const norm=s=>String(s||'').trim().toLocaleLowerCase('es').normalize('NFD').replace(/[̀-ͯ]/g,'');
  const CLOCK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';
  const PIN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>';
  const HEART='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>';
  const DEFAULT_ETA='25–40 min';
  const idFromOnclick=el=>{const m=String(el?.getAttribute('onclick')||'').match(/\('([^']+)'/);return m?m[1]:null};
  const findRest=id=>(typeof restaurants!=='undefined'&&Array.isArray(restaurants))?restaurants.find(x=>String(x.id)===String(id)):null;
  const restName=r=>pick(r,['nombre','nombre_negocio','razon_social'],'El negocio');
  const etaOf=r=>String((r&&r.tiempo_estimado)||'').trim()||DEFAULT_ETA;

  /* ---------- Próxima apertura: "Abre hoy 6 p. m." ---------- */
  function nextOpeningLabel(r){
    try{
      const h=pick(r,['horario','horarios','horario_atencion','horario_atencion_negocio'],'');
      if(!h)return '';
      const now=getLimaNow();
      for(let d=0;d<=7;d++){
        const date=new Date(now);date.setDate(date.getDate()+d);
        const range=getDailySchedule(h,date);if(!range)continue;
        const op=new Date(date);op.setHours(Math.floor(range.open/60),range.open%60,0,0);
        if(op>now){
          const hh=op.getHours(),mm=op.getMinutes();
          const t=`${hh%12||12}${mm?':'+String(mm).padStart(2,'0'):''} ${hh>=12?'p. m.':'a. m.'}`;
          const day=d===0?'hoy':d===1?'mañana':'el '+['domingo','lunes','martes','miércoles','jueves','viernes','sábado'][op.getDay()];
          return `Abre ${day} ${t}`;
        }
      }
    }catch(e){}
    return '';
  }
  window.pdNextOpeningLabel=nextOpeningLabel;

  /* ---------- Favoritos ---------- */
  const FAV_KEY='pidemas_favoritos';
  const getFavs=()=>{const f=LS.get(FAV_KEY,[]);return Array.isArray(f)?f.map(String):[]};
  function toggleFav(id){
    const f=getFavs();const i=f.indexOf(String(id));
    if(i>=0)f.splice(i,1);else f.unshift(String(id));
    LS.set(FAV_KEY,f);
    toast(i>=0?'Quitado de favoritos':'Agregado a favoritos');
    enhanceRestaurants();
  }
  window.pdToggleFav=toggleFav;

  /* ---------- Calificaciones promedio por negocio ---------- */
  let ratingMap=new Map();
  async function loadRatings(){
    try{
      const {data,error}=await sb.from('negocio_calificaciones').select('negocio_id,promedio,total');
      if(error||!Array.isArray(data))return;
      ratingMap=new Map(data.map(x=>[String(x.negocio_id),x]));
      enhanceRestaurants();
    }catch(e){}
  }

  /* ---------- Tarjetas de negocios ---------- */
  function enhanceRestaurants(){
    const el=document.getElementById('restaurants');if(!el)return;
    const favs=getFavs();
    const cards=[...el.querySelectorAll(':scope>.restaurant')];
    cards.forEach(card=>{
      const btn=card.querySelector(':scope>button:not(.pdFav)');
      const id=idFromOnclick(btn);if(!id)return;
      const r=findRest(id);if(!r)return;
      card.dataset.negocioId=id;
      card.querySelectorAll('.pdFav,.pdEta').forEach(x=>x.remove());
      const on=favs.includes(String(id));
      card.insertAdjacentHTML('afterbegin',`<button type="button" class="pdFav ${on?'is-on':''}" aria-pressed="${on}" aria-label="${on?'Quitar de favoritos':'Agregar a favoritos'}" onclick="event.stopPropagation();pdToggleFav('${escH(id)}')">${HEART}</button>`);
      const open=isRestaurantOpen(r);
      const rt=ratingMap.get(String(id));
      const stars=rt&&Number(rt.total)>=3?`<span class="pdStars">★ ${Number(rt.promedio).toFixed(1)}</span>`:'';
      const status=card.querySelector('.restaurantStatus');
      if(open){
        status?.insertAdjacentHTML('beforebegin',`<div class="pdEta">${CLOCK}<span>${escH(etaOf(r))}</span>${stars}</div>`);
      }else{
        if(stars)status?.insertAdjacentHTML('beforebegin',`<div class="pdEta">${stars}</div>`);
        const label=nextOpeningLabel(r);
        if(label&&status)status.textContent=label;
      }
    });
    // Favoritos primero, respetando el orden original del resto.
    const favCards=cards.filter(c=>favs.includes(String(c.dataset.negocioId)));
    favCards.sort((a,b)=>favs.indexOf(a.dataset.negocioId)-favs.indexOf(b.dataset.negocioId));
    const before=[...el.children].slice(0,favCards.length);
    favCards.reverse().forEach(c=>el.prepend(c));
    if(favCards.some((c,i)=>before[before.length-1-i]!==c))el.scrollLeft=0;
  }
  if(typeof window.renderRestaurants==='function'){
    const _rr=window.renderRestaurants;
    window.renderRestaurants=function(){const out=_rr.apply(this,arguments);try{enhanceRestaurants()}catch(e){console.warn('[Pidemás] negocios',e)}return out};
  }

  /* ---------- Encabezado de la carta: tiempo estimado / próxima apertura ---------- */
  let currentNegocioId=null;
  if(typeof window.abrirModalCarta==='function'){
    const _amc=window.abrirModalCarta;
    window.abrirModalCarta=function(r){
      const out=_amc.apply(this,arguments);
      try{
        currentNegocioId=r?.id??null;
        const txt=document.querySelector('#cartaModalNegocio .pdCartaTxt');
        const pill=txt?.querySelector('.pdPill');
        if(pill){
          if(isRestaurantOpen(r)) pill.insertAdjacentHTML('afterend',`<span class="pdCartaEta">${CLOCK}${escH(etaOf(r))}</span>`);
          else{const l=nextOpeningLabel(r);if(l)pill.textContent=l;}
        }
      }catch(e){}
      return out;
    };
  }

  /* ---------- Lo más pedido ---------- */
  const topCache=new Map();
  function insertTop(){
    const target=document.getElementById('cartaModalProducts');if(!target)return;
    target.querySelector('.pdTopBlock')?.remove();
    const top=topCache.get(String(currentNegocioId));if(!top||!top.length)return;
    const cards=[...target.querySelectorAll('.categoryGrid .product')];
    const used=new Set();const picked=[];
    for(const t of top){
      const pdTn=String(t.nombre_producto||''),pdM=pdTn.match(/^(.*?)\s*\(([^()]+)\)\s*$/),pdBase=pdM?pdM[1]:pdTn,pdCat=pdM?norm(pdM[2]):'';const pdOk=c=>!used.has(c)&&norm(c.querySelector('h3')?.textContent)===norm(pdBase);const c=cards.find(c=>pdOk(c)&&(!pdCat||norm(c.closest('.categoryBlock')?.querySelector('.categoryTitle')?.dataset.nombre||c.closest('.categoryBlock')?.querySelector('.categoryTitle')?.textContent).startsWith(pdCat)))||cards.find(pdOk);
      if(c){used.add(c);picked.push(c.cloneNode(true));}
      if(picked.length>=3)break;
    }
    if(!picked.length)return;
    const sec=document.createElement('section');sec.className='categoryBlock pdTopBlock';
    sec.innerHTML='<h3 class="categoryTitle">Lo más pedido</h3><div class="categoryGrid"></div>';
    picked.forEach(c=>sec.querySelector('.categoryGrid').appendChild(c));
    target.prepend(sec);
  }
  async function loadTop(id){
    if(!id)return;
    if(!topCache.has(String(id))){
      try{
        const {data,error}=await sb.rpc('productos_mas_pedidos',{p_negocio_id:id});
        topCache.set(String(id),!error&&Array.isArray(data)?data:[]);
      }catch(e){topCache.set(String(id),[]);}
    }
    if(String(currentNegocioId)===String(id))insertTop();
  }
  if(typeof window.actualizarContenidoModalCarta==='function'){
    const _acm=window.actualizarContenidoModalCarta;
    window.actualizarContenidoModalCarta=function(){const out=_acm.apply(this,arguments);try{insertTop()}catch(e){}return out};
  }
  if(typeof window.showRestaurant==='function'){
    const _sr=window.showRestaurant;
    window.showRestaurant=async function(id){currentNegocioId=id;const out=await _sr.apply(this,arguments);loadTop(id);return out};
  }

  /* ---------- Direcciones guardadas ---------- */
  const ADDR_KEY='pidemas_direcciones';
  const getAddrs=()=>{const a=LS.get(ADDR_KEY,[]);return Array.isArray(a)?a.filter(x=>x&&x.direccion):[]};
  function saveAddr(dir,ref){
    dir=String(dir||'').trim();if(!dir)return;
    const a=getAddrs().filter(x=>norm(x.direccion)!==norm(dir));
    a.unshift({direccion:dir,referencia:String(ref||'').trim()});
    LS.set(ADDR_KEY,a.slice(0,4));
  }
  if(typeof window.saveCustomerInfo==='function'){
    const _sci=window.saveCustomerInfo;
    window.saveCustomerInfo=function(){
      const out=_sci.apply(this,arguments);
      try{saveAddr(document.getElementById('cDireccion')?.value,document.getElementById('cReferencia')?.value)}catch(e){}
      return out;
    };
  }
  function pickAddr(i){
    const a=getAddrs()[i];if(!a)return;
    const d=document.getElementById('cDireccion'),r=document.getElementById('cReferencia');
    if(d){d.value=a.direccion;d.dispatchEvent(new Event('input',{bubbles:true}))}
    if(r){r.value=a.referencia||'';r.dispatchEvent(new Event('input',{bubbles:true}))}
    renderAddrs();
  }
  function forgetAddr(i){
    const a=getAddrs();a.splice(i,1);LS.set(ADDR_KEY,a);renderAddrs();
  }
  function newAddr(){
    const d=document.getElementById('cDireccion'),r=document.getElementById('cReferencia');
    if(d)d.value='';if(r)r.value='';renderAddrs();d?.focus();
  }
  window.pdPickAddr=pickAddr;window.pdForgetAddr=forgetAddr;window.pdNewAddr=newAddr;
  function renderAddrs(){
    const input=document.getElementById('cDireccion');if(!input)return;
    const field=input.closest('.field');if(!field)return;
    let wrap=document.getElementById('pdAddrWrap');
    const a=getAddrs();
    if(!a.length){wrap?.remove();return}
    if(!wrap){wrap=document.createElement('div');wrap.id='pdAddrWrap';wrap.className='pdAddrWrap';field.parentElement.insertBefore(wrap,field)}
    const cur=norm(input.value);
    wrap.innerHTML=`<span class="pdKicker">Direcciones guardadas</span><div class="pdAddrList">${a.map((x,i)=>`<button type="button" class="pdAddr ${cur&&norm(x.direccion)===cur?'is-on':''}" onclick="pdPickAddr(${i})">${PIN}<span class="pdAddrTxt"><strong>${escH(x.direccion)}</strong>${x.referencia?`<span>${escH(x.referencia)}</span>`:''}</span><span class="pdAddrDel" role="button" aria-label="Olvidar esta dirección" onclick="event.stopPropagation();pdForgetAddr(${i})">×</span></button>`).join('')}</div><button type="button" class="pdAddrNew" onclick="pdNewAddr()">+ Usar otra dirección</button>`;
  }
  if(typeof window.openCheckout==='function'){
    const _oc=window.openCheckout;
    window.openCheckout=function(){
      const out=_oc.apply(this,arguments);
      setTimeout(()=>{
        try{
          const a=getAddrs();
          const d=document.getElementById('cDireccion'),r=document.getElementById('cReferencia');
          if(a.length&&d&&!d.value.trim()){d.value=a[0].direccion;if(r&&!r.value.trim())r.value=a[0].referencia||''}
          renderAddrs();
          d?.addEventListener('input',()=>{const w=document.getElementById('pdAddrWrap');if(!w)return;const cur=norm(d.value);w.querySelectorAll('.pdAddr').forEach((b,i)=>b.classList.toggle('is-on',!!cur&&norm(getAddrs()[i]?.direccion)===cur))});
        }catch(e){console.warn('[Pidemás] direcciones',e)}
      },0);
      return out;
    };
  }

  /* ---------- Historial: estado real, volver a pedir y calificar ---------- */
  const RATED_KEY='pidemas_calificados';
  const getRated=()=>{const r=LS.get(RATED_KEY,{});return r&&typeof r==='object'?r:{}};
  async function syncHistory(){
    const h=getOrderHistory();const ids=h.map(x=>x&&x.id).filter(Boolean).slice(0,20);
    if(!ids.length)return false;
    const {data,error}=await sb.from('pedidos').select('id,estado,motorizado_id,negocio_id').in('id',ids);
    if(error||!Array.isArray(data))return false;
    const m=new Map(data.map(x=>[String(x.id),x]));let changed=false;
    h.forEach(o=>{const d=m.get(String(o?.id));if(!d)return;['estado','motorizado_id','negocio_id'].forEach(k=>{if(d[k]!=null&&d[k]!==o[k]){o[k]=d[k];changed=true}})});
    if(changed)LS.set('pidemas_order_history',h);
    return changed;
  }
  function enhanceHistory(){
    const rated=getRated();const h=getOrderHistory();
    document.querySelectorAll('#modal .pdHistCard').forEach(card=>{
      const del=card.querySelector('[onclick*="deleteOrderHistoryItem"]');
      const id=idFromOnclick(del);if(!id)return;
      const o=h.find(x=>String(x.id)===String(id));if(!o)return;
      const idx=trackingIndex(o.estado);
      const actions=card.querySelector('.pdHistActions');if(!actions)return;
      actions.querySelectorAll('.pdReorderBtn,.pdRateBtn').forEach(x=>x.remove());
      card.querySelector('.pdRated')?.remove();
      if(idx===5||idx===-1){
        if((o.items||[]).length)actions.insertAdjacentHTML('afterbegin',`<button type="button" class="pdBtnDark pdReorderBtn" onclick="pdReorder('${escH(id)}')">Volver a pedir</button>`);
      }
      if(idx===5){
        if(rated[id])actions.insertAdjacentHTML('beforebegin',`<div class="pdRated">Tu calificación: <strong>${'★'.repeat(Number(rated[id])||0)}</strong></div>`);
        else del.insertAdjacentHTML('beforebegin',`<button type="button" class="pdBtnLight pdRateBtn" onclick="pdOpenRating('${escH(id)}')">Calificar</button>`);
      }
    });
  }
  let syncing=false;
  if(typeof window.openOrderHistory==='function'){
    const _ooh=window.openOrderHistory;
    window.openOrderHistory=function(){
      const out=_ooh.apply(this,arguments);
      try{enhanceHistory()}catch(e){}
      if(!syncing){
        syncing=true;
        syncHistory().then(ch=>{syncing=false;if(ch&&document.querySelector('#modal .pdHistCard')){_ooh();enhanceHistory()}}).catch(()=>{syncing=false});
      }
      return out;
    };
  }

  window.pdReorder=async function(orderId){
    const o=getOrderHistory().find(x=>String(x.id)===String(orderId));if(!o)return;
    const items=(o.items||[]).filter(x=>x&&x.nombre);
    if(!items.length){toast('Este pedido no tiene productos para repetir.');return}
    const negId=o.negocio_id||null;
    const r=negId?findRest(negId):null;
    if(negId&&!r){toast('Este negocio ya no está disponible en Pidemás.');return}
    if(r&&!isRestaurantOpen(r)){const l=nextOpeningLabel(r);toast(`${restName(r)} está cerrado ahora.${l?' '+l+'.':''}`);return}
    if(cart.length&&!confirm('Se reemplazará lo que tienes en el carrito. ¿Continuar?'))return;
    try{closeModal()}catch(e){}
    cart=[];saveCart();updateCart();
    if(r)await window.showRestaurant(r.id);
    const pool=(products||[]).filter(p=>negId?(p.origen==='negocio'&&String(p.negocio_id)===String(negId)):p.origen!=='negocio');
    let added=0;const missing=[];
    const realToast=window.toast;window.toast=function(){};
    try{
      for(const it of items){
        const p=pool.find(p=>it.id&&String(p.id)===String(it.id)&&(!it.origen||p.origen===it.origen))
          ||pool.find(p=>norm(pick(p,['nombre','nombre_producto'],''))===norm(it.nombre))||(()=>{const pdM=String(it.nombre||'').match(/^(.*?)\s*\(([^()]+)\)\s*$/);if(!pdM)return null;const L=pool.filter(p=>norm(pick(p,['nombre','nombre_producto'],''))===norm(pdM[1]));return L.find(p=>window.pdCategoriaDe&&norm(pdCategoriaDe(p))===norm(pdM[2]))||L[0]||null})();
        if(p&&addToCart(p.id,p.origen,Math.max(1,Number(it.cantidad||1))))added++;else missing.push(it.nombre);
      }
    }finally{window.toast=realToast}
    if(!added){toast('Los productos de ese pedido ya no están disponibles.');return}
    toast(`Agregamos ${added} producto${added===1?'':'s'} a tu carrito.${missing.length?' No disponible: '+missing.join(', ')+'.':''}`);
    if(!r)openCart();
  };

  window.pdOpenRating=function(orderId){
    const o=getOrderHistory().find(x=>String(x.id)===String(orderId));if(!o)return;
    const negName=(o.negocio_id&&getRestaurantNameById(o.negocio_id))||'el negocio';
    const stars=g=>`<div class="pdRateStars" data-group="${g}">${[1,2,3,4,5].map(n=>`<button type="button" data-v="${n}" aria-label="${n} estrella${n>1?'s':''}">★</button>`).join('')}</div>`;
    showModal(`<div class="sheet pdRateSheet"><div class="sheetTop"><h2>Califica tu pedido</h2><button class="close" onclick="closeModal()" aria-label="Cerrar">×</button></div>
      <div class="pdKicker">Pedido #${escH(String(o.id).slice(0,8).toUpperCase())}</div>
      ${o.negocio_id?`<div class="pdRateGroup"><span>¿Qué tal la comida de ${escH(negName)}?</span>${stars('negocio')}</div>`:''}
      ${o.motorizado_id?`<div class="pdRateGroup"><span>¿Qué tal el servicio del motorizado?</span>${stars('motorizado')}</div>`:''}
      <textarea id="pdRateComment" maxlength="300" placeholder="Comentario (opcional)"></textarea>
      <button type="button" class="pdRateSend" id="pdRateSend" disabled>Enviar calificación</button>
    </div>`);
    const val={negocio:0,motorizado:0};
    const need=['negocio','motorizado'].filter(g=>document.querySelector(`.pdRateStars[data-group="${g}"]`));
    const send=document.getElementById('pdRateSend');
    if(!need.length)send.disabled=false;
    document.querySelectorAll('.pdRateStars').forEach(box=>{
      box.addEventListener('click',ev=>{
        const b=ev.target.closest('button[data-v]');if(!b)return;
        const g=box.dataset.group;val[g]=Number(b.dataset.v);
        box.querySelectorAll('button').forEach(x=>x.classList.toggle('on',Number(x.dataset.v)<=val[g]));
        send.disabled=!need.every(k=>val[k]>0);
      });
    });
    send.addEventListener('click',async()=>{
      send.disabled=true;send.textContent='Enviando…';
      const row={pedido_id:o.id,negocio_id:o.negocio_id||null,motorizado_id:o.motorizado_id||null,
        estrellas_negocio:val.negocio||null,estrellas_motorizado:val.motorizado||null,
        comentario:(document.getElementById('pdRateComment')?.value||'').trim()||null};
      const {error}=await sb.from('calificaciones').insert(row);
      const rated=getRated();
      if(error&&String(error.code)!=='23505'){
        console.warn('calificaciones',error);
        toast('No se pudo enviar la calificación. Inténtalo más tarde.');
        send.disabled=false;send.textContent='Enviar calificación';return;
      }
      rated[o.id]=val.negocio||val.motorizado||5;LS.set(RATED_KEY,rated);
      toast('¡Gracias por tu calificación!');
      openOrderHistory();
    });
  };

  /* ---------- Avisos cuando cambia el estado del pedido ---------- */
  const STATUS_MSG={asignado:'Ya tienes un motorizado asignado',aceptado:'El motorizado aceptó tu pedido',en_camino:'Tu pedido va en camino',en_entrega:'El motorizado está llegando a tu dirección',entregado:'Pedido entregado. ¡Buen provecho!',cancelado:'Tu pedido fue cancelado'};
  const baseTitle=document.title;
  function checkStatus(){
    const o=getLastOrder();if(!o?.id)return;
    const st=String(o.estado||'pendiente').toLowerCase();
    const key=o.id+'|'+st;
    let last='';try{last=localStorage.getItem('pidemas_aviso_estado')||''}catch(e){}
    if(last===key)return;
    try{localStorage.setItem('pidemas_aviso_estado',key)}catch(e){}
    if(!last.startsWith(o.id+'|'))return; // primera vez que vemos este pedido: sin aviso
    const msg=STATUS_MSG[st];if(!msg)return;
    toast(msg);
    try{navigator.vibrate&&navigator.vibrate([150,80,150])}catch(e){}
    if(document.hidden){document.title='● '+msg+' · Pidemás'}
    try{
      if('Notification' in window&&Notification.permission==='granted'){
        const n=new Notification('Pidemás · Pedido #'+String(o.id).slice(0,8).toUpperCase(),{body:msg,tag:'pidemas-'+o.id});
        n.onclick=()=>{window.focus();try{openOrderTracking()}catch(e){}n.close()};
      }
    }catch(e){}
  }
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)document.title=baseTitle});
  if(typeof window.refreshLastOrderTracking==='function'){
    const _rl=window.refreshLastOrderTracking;
    window.refreshLastOrderTracking=async function(){const out=await _rl.apply(this,arguments);try{checkStatus()}catch(e){}return out};
  }
  if(typeof window.rememberLastOrder==='function'){
    const _rlo=window.rememberLastOrder;
    window.rememberLastOrder=function(){
      const out=_rlo.apply(this,arguments);
      try{checkStatus()}catch(e){}
      // En computadoras pedimos permiso para avisar aunque la pestaña esté en segundo plano.
      try{if(!/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)&&'Notification' in window&&Notification.permission==='default')Notification.requestPermission()}catch(e){}
      return out;
    };
  }

  /* ---------- Arranque ---------- */
  function boot(){
    try{enhanceRestaurants()}catch(e){}
    setTimeout(loadRatings,1500);
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot,{once:true});else boot();
})();
</script>

<script id="pd-horario-global-js">
/* Horario general de Pidemás: atención 9:00 am – 10:00 pm, último pedido 9:30 pm (hora de Lima). */
(function(){
  if(window.__pdHorarioGlobal)return; window.__pdHorarioGlobal=true;
  var H=window.PD_HORARIO={abre:9*60,ultimoPedido:21*60+30,cierra:22*60,aviso:21*60};
  function limaMin(){
    try{var p=new Intl.DateTimeFormat('en-US',{timeZone:'America/Lima',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(new Date());
      var h=+p.find(function(x){return x.type==='hour'}).value%24, m=+p.find(function(x){return x.type==='minute'}).value; return h*60+m;}
    catch(e){var d=new Date();return d.getHours()*60+d.getMinutes();}
  }
  function abiertoGeneral(min){min=(min==null?limaMin():min);return min>=H.abre&&min<H.ultimoPedido;}
  window.pdServicioAbierto=abiertoGeneral;

  // Recorta el horario de cada negocio a la ventana general de Pidemás.
  if(typeof window.getDailySchedule==='function'){
    var orig=window.getDailySchedule;
    window.getDailySchedule=function(horario,date){
      var r=orig.apply(this,arguments); if(!r)return r;
      var open=r.open, close=r.close;
      if(open===close){open=H.abre;close=H.ultimoPedido;}
      else if(open>close){close=H.ultimoPedido;}            // horario que cruza la medianoche
      open=Math.max(open,H.abre); close=Math.min(close,H.ultimoPedido);
      if(open>=close)return null;
      var out={}; for(var k in r)out[k]=r[k]; out.open=open; out.close=close; return out;
    };
  }

  function msgCerrado(){if(window.pdHorarioMsgCerrado)return window.pdHorarioMsgCerrado();return 'Pidemás recibe pedidos de 9:00 a. m. a 9:30 p. m. Vuelve '+(limaMin()<H.abre?'hoy':'mañana')+' desde las 9:00 a. m.';}
  function bloquear(){
    if(abiertoGeneral()||window.__pdProg)return false;
    if(typeof window.mostrarAvisoHorario==='function')window.mostrarAvisoHorario(msgCerrado());
    else if(typeof window.toast==='function')window.toast(msgCerrado());
    return true;
  }
  ['openCheckout','submitCartOrder'].forEach(function(fn){
    var f=window[fn]; if(typeof f!=='function')return;
    window[fn]=function(){ if(bloquear())return; return f.apply(this,arguments); };
  });

  function barra(){
    var bar=document.getElementById('pdHorarioBar');
    if(!bar){bar=document.createElement('div');bar.id='pdHorarioBar';bar.setAttribute('role','status');var hd=document.querySelector('header')||document.body;hd.appendChild(bar);}
    var m=limaMin();
    if(!abiertoGeneral(m)){bar.className='show closed';bar.innerHTML='<span class="pdHDot"></span><span>'+(window.pdHorarioBarraCerrado?window.pdHorarioBarraCerrado():'Cerrado · pedidos de 9:00 a. m. a 9:30 p. m.')+'</span>';}
    else if(m>=H.aviso){var f=H.ultimoPedido-m;bar.className='show';bar.innerHTML='<span class="pdHDot"></span><span><b>Último pedido '+(window.pdHoraTxt?window.pdHoraTxt(H.ultimoPedido):'9:30 p. m.')+'</b> · quedan '+f+' min</span>';}
    else{bar.className='';bar.innerHTML='';}
  }
  var estado=abiertoGeneral();
  function tick(){
    barra();
    var ahora=abiertoGeneral();
    if(ahora!==estado){estado=ahora;try{if(typeof window.refreshRestaurantStatuses==='function')window.refreshRestaurantStatuses();}catch(e){}}
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',tick);else tick();
  setInterval(tick,30000);
})();
</script>

<script id="pdflow-tienda-js">
/* Etapa 2 · El cliente ve la preparación del negocio y la llegada del motorizado al local. */
(function(){
  if(window.__pdFlowTienda||typeof window.renderTracking!=='function')return; window.__pdFlowTienda=true;
  const orig=window.renderTracking;
  const hhmm=d=>d.toLocaleTimeString('es-PE',{hour:'numeric',minute:'2-digit',hour12:true,timeZone:'America/Lima'});
  function nota(o){
    const s=String(o?.estado||'').toLowerCase();
    if(['en_camino','en_entrega','camino_entrega','entregado','cancelado'].includes(s))return '';
    if(s==='pendiente'&&o.negocio_id)return '<b>Esperando que el negocio confirme tu pedido.</b> Te escribirá por WhatsApp para coordinar el pago.';
    if(o.en_local_en&&['asignado','aceptado','pedido_aceptado','camino_recojo'].includes(s))return '<b>Tu motorizado está en el local</b> recogiendo tu pedido.';
    if(o.listo_para_recojo===true)return '<b>Tu pedido está listo.</b> El motorizado pasará a recogerlo.';
    if(o.negocio_aceptado_en&&Number(o.tiempo_preparacion_min)>0){const t=new Date(new Date(o.negocio_aceptado_en).getTime()+Number(o.tiempo_preparacion_min)*60000);return '<b>Preparando tu pedido</b> · listo aprox. a las '+hhmm(t);}
    return '';
  }
  window.renderTracking=function(o){
    const html=orig.apply(this,arguments);const n=o?nota(o):'';
    if(!n)return html;
    return html.replace(/(<div class="pdTrkHead">[\s\S]*?<\/div>)/,'$1<div class="pdTrkNote"><i></i><span>'+n+'</span></div>');
  };
})();
</script>

<script id="pdtipo-tienda-js">
/* Etapa 4 · Tienda: productos con tallas, colores u opciones, varias fotos, precio de oferta y licorería +18. */
(function(){
  if(window.__pdTipoTienda)return; window.__pdTipoTienda=true;
  const COMIDA=['Restaurantes','Comida criolla','Pizzerías','Pollerías','Hamburgueserías','Comida rápida','Sangucherías','Paviferías','Cevicherías','Chifas','Sushi y comida japonesa','Parrillas y anticuchos','Heladerías','Cafeterías','Juguerías','Dulcerías y pastelerías','Panaderías'];
  const plantilla=cat=>{const c=String(cat||'').trim();if(!c||COMIDA.includes(c))return 'comida';if(['Ropa y moda','Calzado y zapatillas'].includes(c))return 'moda';if(c==='Licorerías')return 'licoreria';return 'opciones'};
  window.pdPlantilla=plantilla;
  const E=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const arr=v=>{if(Array.isArray(v))return v;try{const p=JSON.parse(v||'[]');return Array.isArray(p)?p:[]}catch(e){return []}};
  const findP=(id,origen)=>(typeof products!=='undefined'?products:[]).find(x=>String(x.id)===String(id)&&x.origen===origen);
  const restOf=p=>p&&p.origen==='negocio'?(typeof restaurants!=='undefined'?restaurants:[]).find(r=>String(r.id)===String(p.negocio_id)):null;
  const catOf=r=>r?(typeof pick==='function'?pick(r,['categoria_negocio','categoria_comercial','tipo_negocio','categoria'],''):r.categoria_negocio):'';
  const vars=p=>arr(p?.variantes).filter(v=>v&&v.clave);
  const off=p=>{const a=Number(p?.precio_antes),n=Number(p?.precio);return a>n&&n>0?Math.round((1-n/a)*100):0};

  // +18: el carrito contiene productos de una licorería.
  window.pdCarrito18=function(){return (typeof cart!=='undefined'?cart:[]).some(x=>{if(x.origen!=='negocio')return false;const r=(typeof restaurants!=='undefined'?restaurants:[]).find(r=>String(r.id)===String(x.negocio_id));return plantilla(catOf(r))==='licoreria'})};

  // Tarjetas: precio de oferta.
  function decorar(){
    document.querySelectorAll('.productDetailCard[onclick^="openProductDetails("]:not([data-pdoff])').forEach(card=>{
      card.dataset.pdoff='1';
      const m=String(card.getAttribute('onclick')).match(/openProductDetails\('([^']*)','([^']*)'\)/);if(!m)return;
      const p=findP(m[1],m[2]);const o=off(p);if(!o)return;
      const pr=card.querySelector('.price');if(pr)pr.innerHTML=`S/ ${Number(p.precio).toFixed(2)}<s>S/ ${Number(p.precio_antes).toFixed(2)}</s>`;
      const im=card.querySelector('.productImg');if(im&&!im.querySelector('.pdOffTag'))im.insertAdjacentHTML('afterbegin',`<span class="pdOffTag">−${o}%</span>`);
    });
  }
  let t=null;new MutationObserver(()=>{clearTimeout(t);t=setTimeout(decorar,80)}).observe(document.body,{childList:true,subtree:true});

  // Ficha con variantes.
  const S={};
  function render(){
    const p=findP(S.id,S.origen);if(!p)return;
    const r=restOf(p),tipo=plantilla(catOf(r)),vs=vars(p);
    const name=typeof pick==='function'?pick(p,['nombre','nombre_producto'],'Producto'):p.nombre;
    const desc=typeof splitCatalogDescription==='function'?splitCatalogDescription(p.descripcion||'').description:(p.descripcion||'');
    const fotos=[p.imagen_url,...arr(p.fotos)].filter(Boolean);
    const colores=[...new Set(vs.map(v=>v.color).filter(Boolean))];
    const moda=tipo==='moda'||vs.some(v=>v.talla);
    if(moda&&colores.length&&!S.color)S.color=(vs.find(v=>v.color&&Number(v.stock)>0)||vs[0]).color||'';
    const pool=moda&&colores.length?vs.filter(v=>v.color===S.color):vs;
    const sel=vs.find(v=>v.clave===S.clave);
    const o=off(p);
    let selector='';
    if(moda){
      if(colores.length)selector+=`<div><div class="pvLbl">Color: <span>${E(S.color||'—')}</span></div><div class="pvChips">${colores.map(c=>`<button type="button" class="${c===S.color?'on':''}" onclick="pdVarColor(${colores.indexOf(c)})">${E(c)}</button>`).join('')}</div></div>`;
      selector+=`<div><div class="pvLbl">Talla</div><div class="pvChips">${pool.map(v=>`<button type="button" class="${v.clave===S.clave?'on':''}" ${Number(v.stock)>0?'':'disabled'} onclick="pdVarPick(${vs.indexOf(v)})">${E(v.talla||v.opcion||v.clave)}</button>`).join('')}</div></div>`;
    }else{
      selector=`<div><div class="pvLbl">Elige una opción</div><div class="pvChips">${vs.map(v=>`<button type="button" class="${v.clave===S.clave?'on':''}" ${Number(v.stock)>0?'':'disabled'} onclick="pdVarPick(${vs.indexOf(v)})">${E(v.opcion||v.clave)}</button>`).join('')}</div></div>`;
    }
    const left=sel?(Number(sel.stock)<=5?`Quedan ${Number(sel.stock)}`:''):'';
    const go=vs.length?(sel?`Agregar · ${E(sel.clave)}`:(moda?'Elige tu talla':'Elige una opción')):'Agregar al carrito';
    const html=`<div class="sheet"><div class="sheetTop"><h2>Detalle del producto</h2><button class="close" onclick="closeModal()" aria-label="Cerrar">×</button></div><div class="pvSheet">
      ${fotos.length?`<div class="pvPhotos">${fotos.map(u=>`<img src="${E(u)}" alt="${E(name)}" loading="lazy">`).join('')}</div>`:''}
      <h3>${E(name)}</h3>
      <div class="pvPrice">S/ ${Number(p.precio||0).toFixed(2)}${o?`<s>S/ ${Number(p.precio_antes).toFixed(2)}</s><span class="pvOff">−${o}%</span>`:''}</div>
      ${desc?`<p class="pvDesc">${E(desc)}</p>`:''}
      ${vs.length?selector:''}
      <div class="pvLeft">${E(left)}</div>
      ${tipo==='licoreria'?'<div class="pv18">Venta solo a mayores de 18 años. El motorizado te pedirá tu DNI al entregar.</div>':''}
      <div class="pvBar"><div class="pvQty"><button type="button" onclick="pdVarQty(-1)" aria-label="Quitar uno">−</button><b>${S.qty}</b><button type="button" onclick="pdVarQty(1)" aria-label="Agregar uno">+</button></div><button type="button" class="pvGo" ${vs.length&&!sel?'disabled':''} onclick="pdVarAdd()">${go}</button></div>
    </div></div>`;
    showModal(html);
  }
  window.pdVarColor=i=>{const p=findP(S.id,S.origen);const cs=[...new Set(vars(p).map(v=>v.color).filter(Boolean))];S.color=cs[i]||'';S.clave='';S.qty=1;render()};
  window.pdVarPick=i=>{const p=findP(S.id,S.origen);const v=vars(p)[i];if(!v)return;S.clave=v.clave;S.qty=1;render()};
  window.pdVarQty=d=>{const p=findP(S.id,S.origen);const v=vars(p).find(x=>x.clave===S.clave);const max=v?Number(v.stock):(typeof getProductStock==='function'?getProductStock(p):null);S.qty=Math.max(1,S.qty+d);if(max!=null&&Number.isFinite(Number(max)))S.qty=Math.min(S.qty,Math.max(1,Number(max)));render()};
  window.pdVarAdd=function(){
    const p=findP(S.id,S.origen);if(!p)return;
    const vs=vars(p);
    if(!vs.length){if(typeof addToCart==='function'&&addToCart(p.id,p.origen,S.qty))closeModal();return}
    const v=vs.find(x=>x.clave===S.clave);if(!v){toast('Elige una opción.');return}
    if(p.origen==='negocio'){const nr=getProductRestaurantId(p),cr=getCartRestaurantId();if(cr&&String(cr)!==String(nr)){showRestaurantConflict(cr,nr);return}}
    const key=String(p.id)+'|'+p.origen+'|'+v.clave;
    const inCart=cart.filter(x=>x.key===key).reduce((a,x)=>a+Number(x.cantidad||0),0);
    if(inCart+S.qty>Number(v.stock)){toast('No hay suficiente stock de '+v.clave+'.');return}
    const old=cart.find(x=>x.key===key);
    if(old)old.cantidad+=S.qty;else cart.push({key,id:String(p.id),origen:p.origen,negocio_id:getProductRestaurantId(p),nombre:(pick(p,['nombre','nombre_producto'],'Producto'))+' · '+v.clave,precio:Number(p.precio||0),cantidad:S.qty,variante:v.clave});
    saveCart();updateCart();toast('Producto agregado al carrito');closeModal();
  };
  if(typeof window.openProductDetails==='function'){
    const orig=window.openProductDetails;
    window.openProductDetails=function(id,origen){
      const p=findP(id,origen);
      if(!p||(!vars(p).length&&!arr(p.fotos).length&&!off(p)&&plantilla(catOf(restOf(p)))!=='licoreria'))return orig.apply(this,arguments);
      const r=restOf(p);if(r&&typeof isRestaurantOpen==='function'&&!isRestaurantOpen(r)){showRestaurantSchedule(p.negocio_id);return}
      S.id=String(id);S.origen=origen;S.color='';S.clave='';S.qty=1;
      const vs=vars(p);if(vs.length===1&&Number(vs[0].stock)>0)S.clave=vs[0].clave;
      render();
    };
  }

  // Checkout: confirmación de mayoría de edad para licorerías.
  if(typeof window.openCheckout==='function'){
    const oc=window.openCheckout;
    window.openCheckout=function(){
      const out=oc.apply(this,arguments);
      try{if(window.pdCarrito18()&&!document.getElementById('cMayor18')){const pago=document.getElementById('cPago')?.closest('.field');const f=document.createElement('label');f.className='pd18Field';f.innerHTML='<input type="checkbox" id="cMayor18"><span>Confirmo que soy <b>mayor de 18 años</b>. Mostraré mi DNI al recibir el pedido.</span>';pago?pago.before(f):document.querySelector('#modal .sheet')?.appendChild(f)}}catch(e){}
      return out;
    };
  }
  if(typeof window.submitCartOrder==='function'){
    const so=window.submitCartOrder;
    window.submitCartOrder=function(){
      if(window.pdCarrito18()&&!document.getElementById('cMayor18')?.checked){toast('Confirma que eres mayor de 18 años para comprar en una licorería.');document.getElementById('cMayor18')?.focus();return}
      return so.apply(this,arguments);
    };
  }
})();
</script>

<script id="pidemas-tarifa-motor">
(function(){
  if(window.pdTarifa)return;
  const RUTA='config/tarifas.json',BUCKET='restaurantes';
  /* Valores por defecto = la tarifa que ya usaba la tienda */
  const BASE={
    version:1,
    base:6, km_incluidos:3, por_km:2, redondeo:0.1, minimo:6, maximo:0,
    zonas:[],          // {nombre, lat, lng, radio_km, precio, activo}
    recargos:{
      nocturno:{activo:false,desde:'21:00',hasta:'06:00',monto:2},
      lluvia:{activo:false,monto:2},
      pedido_grande:{activo:false,desde_subtotal:150,monto:2}
    },
    actualizado:null
  };
  const cli=()=>{try{return sb}catch(e){}try{return db}catch(e){}return window.db||window.sb||null};
  const clonar=o=>JSON.parse(JSON.stringify(o));
  const mezclar=(a,b)=>{const r=clonar(a);if(!b||typeof b!=='object')return r;Object.keys(b).forEach(k=>{if(b[k]&&typeof b[k]==='object'&&!Array.isArray(b[k])&&r[k]&&typeof r[k]==='object')r[k]=mezclar(r[k],b[k]);else r[k]=b[k]});return r};
  let cfg=clonar(BASE),cargadoEn=0,promesa=null;
  try{const c=JSON.parse(localStorage.getItem('pd_tarifa_cfg')||'null');if(c)cfg=mezclar(BASE,c)}catch(e){}
  function urlPublica(){const c=cli();if(!c||!c.storage)return '';try{return c.storage.from(BUCKET).getPublicUrl(RUTA).data.publicUrl}catch(e){return ''}}
  async function cargar(forzar){
    if(!forzar&&Date.now()-cargadoEn<5*60*1000)return cfg;
    if(promesa)return promesa;
    promesa=(async()=>{
      const u=urlPublica();
      if(u){try{const r=await fetch(u+'?t='+Date.now(),{cache:'no-store'});if(r.ok){const j=await r.json();cfg=mezclar(BASE,j);try{localStorage.setItem('pd_tarifa_cfg',JSON.stringify(cfg))}catch(e){}}}catch(e){}}
      cargadoEn=Date.now();promesa=null;return cfg;
    })();
    return promesa;
  }
  async function guardar(nuevo){
    const c=cli();if(!c||!c.storage)throw new Error('No hay conexión con Supabase.');
    const datos=mezclar(BASE,nuevo);datos.actualizado=new Date().toISOString();
    const blob=new Blob([JSON.stringify(datos,null,2)],{type:'application/json'});
    const {error}=await c.storage.from(BUCKET).upload(RUTA,blob,{upsert:true,contentType:'application/json',cacheControl:'0'});
    if(error)throw error;
    cfg=datos;cargadoEn=Date.now();try{localStorage.setItem('pd_tarifa_cfg',JSON.stringify(cfg))}catch(e){}
    return cfg;
  }
  /* Utilidades */
  const red=(v,p)=>{p=Number(p)||0.1;return Math.round((Number(v)+Number.EPSILON)/p)*p};
  const n2=v=>Math.round((Number(v)+Number.EPSILON)*100)/100;
  function recta(a,b){const R=6371,t=x=>x*Math.PI/180;const dLa=t(b.lat-a.lat),dLo=t(b.lng-a.lng);const h=Math.sin(dLa/2)**2+Math.cos(t(a.lat))*Math.cos(t(b.lat))*Math.sin(dLo/2)**2;return 2*R*Math.atan2(Math.sqrt(h),Math.sqrt(1-h))}
  function coords(v){
    if(!v)return null;if(typeof v==='object'){const la=Number(v.lat??v.latitude),ln=Number(v.lng??v.longitude);return Number.isFinite(la)&&Number.isFinite(ln)?{lat:la,lng:ln}:null}
    const s=decodeURIComponent(String(v));
    for(const re of [/@(-?\d+\.\d+),\s*(-?\d+\.\d+)/,/[?&](?:q|query|ll|destination)=(-?\d+\.\d+),\s*(-?\d+\.\d+)/,/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/,/(-?\d{1,2}\.\d+)\s*,\s*(-?\d{1,3}\.\d+)/]){const m=s.match(re);if(m){const la=Number(m[1]),ln=Number(m[2]);if(Number.isFinite(la)&&Number.isFinite(ln))return {lat:la,lng:ln}}}
    return null;
  }
  async function distanciaRuta(a,b){
    a=coords(a);b=coords(b);if(!a||!b)throw new Error('Faltan las ubicaciones para calcular la distancia.');
    try{const r=await fetch('https://router.project-osrm.org/route/v1/driving/'+a.lng+','+a.lat+';'+b.lng+','+b.lat+'?overview=false&alternatives=true');const j=await r.json();const d=(j.routes||[]).map(x=>Number(x.distance)/1000).filter(Number.isFinite);if(r.ok&&j.code==='Ok'&&d.length)return {km:Math.min(...d),aproximado:false}}catch(e){}
    try{const r=await fetch('https://valhalla1.openstreetmap.de/route',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({locations:[{lat:a.lat,lon:a.lng},{lat:b.lat,lon:b.lng}],costing:'motorcycle',units:'kilometers'})});const j=await r.json();const km=Number(j?.trip?.summary?.length);if(r.ok&&Number.isFinite(km))return {km,aproximado:false}}catch(e){}
    return {km:n2(recta(a,b)*1.3),aproximado:true};
  }
  function horaLima(fecha){try{return new Date(fecha||Date.now()).toLocaleTimeString('es-PE',{hour:'2-digit',minute:'2-digit',hour12:false,timeZone:'America/Lima'})}catch(e){return '12:00'}}
  const aMin=h=>{const m=String(h||'').match(/(\d{1,2}):(\d{2})/);return m?Number(m[1])*60+Number(m[2]):null};
  function enFranja(h,desde,hasta){const x=aMin(h),a=aMin(desde),b=aMin(hasta);if(x==null||a==null||b==null)return false;return a<=b?(x>=a&&x<b):(x>=a||x<b)}
  /*
   * calcular({km, destino, subtotal, fecha}) → {total, km, zona, detalle:[{concepto,monto}], aproximado}
   * Mismo resultado en todos los paneles.
   */
  function calcular(o){return calcularCon(cfg,o)}
  function calcularCon(c,o){
    o=o||{};c=mezclar(BASE,c);const km=Math.max(0,Number(o.km)||0);const det=[];let total=0,zona=null;
    const dest=coords(o.destino);
    if(dest&&Array.isArray(c.zonas)){
      zona=c.zonas.filter(z=>z&&z.activo!==false&&Number.isFinite(Number(z.lat))&&Number.isFinite(Number(z.lng))&&Number(z.radio_km)>0&&Number(z.precio)>=0)
        .map(z=>({z,d:recta({lat:Number(z.lat),lng:Number(z.lng)},dest)})).filter(x=>x.d<=Number(x.z.radio_km)).sort((a,b)=>a.d-b.d)[0]?.z||null;
    }
    if(zona){total=Number(zona.precio);det.push({concepto:'Zona '+(zona.nombre||''),monto:n2(total)})}
    else{
      const base=Number(c.base)||0,inc=Number(c.km_incluidos)||0,pk=Number(c.por_km)||0;
      total=base;det.push({concepto:'Tarifa base (hasta '+inc+' km)',monto:n2(base)});
      if(km>inc){const extra=(km-inc)*pk;total+=extra;det.push({concepto:(km-inc).toFixed(1)+' km adicionales × S/ '+pk.toFixed(2),monto:n2(extra)})}
    }
    const R=c.recargos||{};
    if(R.nocturno&&R.nocturno.activo&&enFranja(horaLima(o.fecha),R.nocturno.desde,R.nocturno.hasta)){total+=Number(R.nocturno.monto)||0;det.push({concepto:'Recargo nocturno',monto:n2(R.nocturno.monto)})}
    if(R.lluvia&&R.lluvia.activo){total+=Number(R.lluvia.monto)||0;det.push({concepto:'Recargo por lluvia',monto:n2(R.lluvia.monto)})}
    if(R.pedido_grande&&R.pedido_grande.activo&&Number(o.subtotal)>=Number(R.pedido_grande.desde_subtotal)){total+=Number(R.pedido_grande.monto)||0;det.push({concepto:'Pedido grande',monto:n2(R.pedido_grande.monto)})}
    let fin=red(total,c.redondeo);
    if(Number(c.minimo)>0&&fin<Number(c.minimo)){det.push({concepto:'Ajuste a tarifa mínima',monto:n2(Number(c.minimo)-fin)});fin=Number(c.minimo)}
    if(Number(c.maximo)>0&&fin>Number(c.maximo)){det.push({concepto:'Tope de tarifa máxima',monto:n2(Number(c.maximo)-fin)});fin=Number(c.maximo)}
    return {total:n2(fin),km:n2(km),zona:zona?zona.nombre:null,detalle:det,aproximado:!!o.aproximado};
  }
  /* Lee el desglose guardado en un pedido (observaciones: __PIDEMAS_DELIVERY__{...}) */
  function desgloseDePedido(obs){
    const s=String(obs||'');const i=s.indexOf('__PIDEMAS_DELIVERY__');if(i<0)return null;
    let j=i+'__PIDEMAS_DELIVERY__'.length,prof=0,k=j;for(;k<s.length;k++){if(s[k]==='{')prof++;else if(s[k]==='}'){prof--;if(!prof){k++;break}}}
    try{const d=JSON.parse(s.slice(j,k));if(d&&typeof d.detalle==='string')d.detalle=d.detalle.split(';').filter(Boolean).map(x=>{const i=x.lastIndexOf('=');return {concepto:x.slice(0,i),monto:Number(x.slice(i+1))}});return d}catch(e){return null}
  }
  /* Desglose en texto plano (sin llaves anidadas) para la marca del pedido */
  window.pdDetalleTxt=function(){const t=window.__pdTarifaUltima;if(!t||!Array.isArray(t.detalle)||!t.detalle.length)return null;return t.detalle.map(d=>String(d.concepto).replace(/[;=|·{}\[\]"]/g,' ')+'='+d.monto).join(';')};
  window.pdTarifa={cargar,guardar,calcular,calcularCon,distanciaRuta,coords,desgloseDePedido,get config(){return clonar(cfg)},porDefecto:()=>clonar(BASE)};
  setTimeout(()=>{cargar().catch(()=>{})},300);
})();
</script>

<script id="pidemas-horario-motor">
(function(){
  if(window.pdHorario)return;
  const RUTA='config/horario.json',BUCKET='restaurantes';
  const DIAS=['domingo','lunes','martes','miercoles','jueves','viernes','sabado'];
  const NOM={lunes:'Lunes',martes:'Martes',miercoles:'Miércoles',jueves:'Jueves',viernes:'Viernes',sabado:'Sábado',domingo:'Domingo'};
  const BASE={dias:{},cerrados:[],aviso_min:30,actualizado:null};
  DIAS.forEach(d=>{BASE.dias[d]={activo:d!=='domingo',abre:'09:00',ultimo:'21:30'}});
  const clon=o=>JSON.parse(JSON.stringify(o));
  const mezclar=c=>{const r=clon(BASE);if(!c||typeof c!=='object')return r;DIAS.forEach(d=>{if(c.dias&&c.dias[d])r.dias[d]=Object.assign(r.dias[d],c.dias[d])});if(Array.isArray(c.cerrados))r.cerrados=c.cerrados.filter(Boolean);if(Number(c.aviso_min)>=0)r.aviso_min=Number(c.aviso_min);r.actualizado=c.actualizado||null;return r};
  let cfg=clon(BASE);try{const c=JSON.parse(localStorage.getItem('pd_horario_cfg')||'null');if(c)cfg=mezclar(c)}catch(e){}
  const cli=()=>{try{return sb}catch(e){}try{return db}catch(e){}return window.db||window.sb||null};
  const aMin=h=>{const m=String(h||'').match(/(\d{1,2}):(\d{2})/);return m?Number(m[1])*60+Number(m[2]):null};
  const hora=m=>{m=((m%1440)+1440)%1440;const h=Math.floor(m/60),mi=m%60,ap=h>=12?'p. m.':'a. m.',h12=h%12||12;return h12+':'+String(mi).padStart(2,'0')+' '+ap};
  function limaHoy(){try{return getLimaNow()}catch(e){}const p=new Intl.DateTimeFormat('en-US',{timeZone:'America/Lima',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(new Date());const v={};p.forEach(x=>v[x.type]=x.value);return new Date(+v.year,+v.month-1,+v.day,+v.hour%24,+v.minute)}
  const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  /* Horario de un día: {abre, ultimo} en minutos, o false si Pidemás no atiende */
  function delDia(fecha){
    const d=fecha||limaHoy();const k=DIAS[d.getDay()];const c=cfg.dias[k];
    if(!c||c.activo===false)return false;
    if((cfg.cerrados||[]).includes(iso(d)))return false;
    const a=aMin(c.abre),u=aMin(c.ultimo);if(a==null||u==null||u<=a)return false;
    return {abre:a,ultimo:u};
  }
  /* Próxima apertura desde ahora */
  function proxima(){
    const n=limaHoy(),cur=n.getHours()*60+n.getMinutes();
    for(let i=0;i<=14;i++){const f=new Date(n);f.setDate(n.getDate()+i);const h=delDia(f);if(!h)continue;if(i===0&&cur>=h.abre)continue;
      const cuando=i===0?'hoy':i===1?'mañana':'el '+['domingo','lunes','martes','miércoles','jueves','viernes','sábado'][f.getDay()];return {cuando,hora:hora(h.abre)}}
    return null;
  }
  /* PD_HORARIO (objeto del horario general de la tienda) pasa a leer este horario.
     Durante getDailySchedule(fecha) se usa el día consultado; en el resto, el de hoy. */
  let ctx=null;
  function instalar(){
    const H=window.PD_HORARIO;if(!H||H.__pd||typeof window.showRestaurant!=='function')return;
    const val=k=>{const h=delDia(ctx||limaHoy());if(!h)return 0;if(k==='abre')return h.abre;if(k==='ultimo')return h.ultimo;if(k==='cierra')return h.ultimo+30;if(k==='aviso')return Math.max(h.abre,h.ultimo-(Number(cfg.aviso_min)||30));return 0};
    Object.defineProperty(H,'abre',{get:()=>val('abre'),configurable:true});
    Object.defineProperty(H,'ultimoPedido',{get:()=>val('ultimo'),configurable:true});
    Object.defineProperty(H,'cierra',{get:()=>val('cierra'),configurable:true});
    Object.defineProperty(H,'aviso',{get:()=>val('aviso'),configurable:true});
    Object.defineProperty(H,'__pd',{value:true});
    const g=window.getDailySchedule;
    if(typeof g==='function'){
      window.getDailySchedule=function(h,date){const f=date||limaHoy();if(!delDia(f))return null;const prev=ctx;ctx=f;try{return g.apply(this,arguments)}finally{ctx=prev}};
    }
  }
  window.pdHoraTxt=hora;
  window.pdHorarioDia=delDia;
  window.pdHorarioMsgCerrado=function(){
    const h=delDia(),p=proxima();
    if(!h)return 'Hoy Pidemás no atiende.'+(p?' Vuelve '+p.cuando+' desde las '+p.hora:'');
    return 'Pidemás recibe pedidos hoy de '+hora(h.abre)+' a '+hora(h.ultimo)+(p&&p.cuando!=='hoy'?' Vuelve '+p.cuando+' desde las '+p.hora:p?' Abrimos a las '+p.hora:'');
  };
  window.pdHorarioBarraCerrado=function(){
    const h=delDia(),p=proxima();
    if(!h)return 'Hoy no atendemos'+(p?' · abrimos '+p.cuando+' '+p.hora:'');
    return 'Cerrado · pedidos de '+hora(h.abre)+' a '+hora(h.ultimo)+(p&&p.cuando!=='hoy'?' · abrimos '+p.cuando+' '+p.hora:'');
  };
  window.pdHorarioSemana=function(){return ['lunes','martes','miercoles','jueves','viernes','sabado','domingo'].map(k=>{const c=cfg.dias[k];return {dia:NOM[k],activo:c.activo!==false,abre:c.abre,ultimo:c.ultimo}})};
  async function cargar(){
    const c=cli();if(!c||!c.storage)return cfg;
    try{const u=c.storage.from(BUCKET).getPublicUrl(RUTA).data.publicUrl;const r=await fetch(u+'?t='+Date.now(),{cache:'no-store'});if(r.ok){cfg=mezclar(await r.json());try{localStorage.setItem('pd_horario_cfg',JSON.stringify(cfg))}catch(e){}}}catch(e){}
    try{if(typeof refreshRestaurantStatuses==='function')refreshRestaurantStatuses()}catch(e){}
    try{if(typeof renderRestaurants==='function')renderRestaurants()}catch(e){}
    return cfg;
  }
  async function guardar(nuevo){
    const c=cli();if(!c||!c.storage)throw new Error('No hay conexión con Supabase.');
    const datos=mezclar(nuevo);datos.actualizado=new Date().toISOString();
    const {error}=await c.storage.from(BUCKET).upload(RUTA,new Blob([JSON.stringify(datos,null,2)],{type:'application/json'}),{upsert:true,contentType:'application/json',cacheControl:'0'});
    if(error)throw error;cfg=datos;try{localStorage.setItem('pd_horario_cfg',JSON.stringify(cfg))}catch(e){}return cfg;
  }
  window.pdHorario={cargar,guardar,delDia,proxima,DIAS,NOM,get config(){return clon(cfg)},porDefecto:()=>clon(BASE)};
  instalar();
  setTimeout(()=>{instalar();cargar()},200);
})();
</script>

          rs.hidden=false;rs.innerHTML='<div class="nada">Buscando…</div>';
          try{const L2=await buscar(v);rs.innerHTML=L2.length?L2.map(r=>'<button type="button" data-a="res" data-r=\''+E(JSON.stringify({lat:r.lat,lng:r.lng}))+'\'><svg class="pdmpI" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-6.1-7-11a7 7 0 0 1 14 0c0 4.9-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg><span>'+E(r.nom)+'<small>'+E(r.sub)+'</small></span></button>').join(''):'<div class="nada">No encontramos esa dirección. Prueba con otra calle o mueve el mapa a mano.</div>'}catch(e){rs.innerHTML='<div class="nada">No se pudo buscar. Mueve el mapa a mano.</div>'}};
        q.addEventListener('input',()=>{clearTimeout(tq);tq=setTimeout(correr,600)});
        q.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();clearTimeout(tq);correr()}});
      }
      document.body.appendChild(m);m.hidden=false;document.documentElement.style.overflow='hidden';
      $('pdmpTit').textContent=o.titulo||'Marcar ubicación';
      $('pdmpTip').textContent=o.tip||'Mueve el mapa hasta el lugar';$('pdmpTip').style.display='';$('pdmpQ').value='';$('pdmpRs').hidden=true;
      const ini=o.centro||PIURA,z=o.centro?18:15;ultima=null;
      $('pdmpDir').textContent='Cargando mapa…';$('pdmpSub').textContent='';
      leaflet().then(L=>{
        if(!big){big=L.map('pdmpBig',{zoomControl:false}).setView([ini.lat,ini.lng],z);L.tileLayer(TILES,{maxZoom:19,attribution:ATTR}).addTo(big);
          big.on('movestart',()=>{m.classList.add('mov');$('pdmpTip').style.display='none'});big.on('moveend',()=>{m.classList.remove('mov');rev()})}
        else big.setView([ini.lat,ini.lng],z,{animate:false});
        setTimeout(()=>{big.invalidateSize();rev()},60);
      }).catch(()=>{$('pdmpDir').textContent='No se pudo cargar el mapa';$('pdmpSub').textContent='Revisa tu conexión e inténtalo de nuevo.'});
    });
  }
  function rev(){
    if(!big)return;const c=big.getCenter();$('pdmpDir').textContent='Buscando dirección…';$('pdmpSub').textContent=fx(c.lat)+', '+fx(c.lng);
    clearTimeout(tRev);tRev=setTimeout(async()=>{const r=await inversa(c);const n=big.getCenter();if(Math.abs(n.lat-c.lat)>1e-6||Math.abs(n.lng-c.lng)>1e-6)return;ultima=r;
      $('pdmpDir').textContent=r&&r.linea?r.linea:'Punto marcado en el mapa';$('pdmpSub').textContent=r&&r.sub?r.sub:fx(c.lat)+', '+fx(c.lng)},500);
  }
  function cerrar(v){const m=$('pdmpMapa');if(m)m.hidden=true;document.documentElement.style.overflow='';const r=resolver;resolver=null;if(r)r(v)}
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('pdmpMapa')&&!$('pdmpMapa').hidden){e.stopPropagation();cerrar(null)}},true);
  window.pdMapaElegir=elegir;

  /* ---------- Botón «Marcar en el mapa» en cada ubicación de los formularios ---------- */
  const CAMPOS=[
    {id:'admRecojoUbicacion',dir:'admRecojoDireccion',titulo:'Lugar de recojo',icono:'ti-package'},
    {id:'admRecojoUbicacionEntrega',dir:'admRecojoEntrega',titulo:'Lugar de entrega',icono:'ti-home'},
    {id:'encGpsRecojo',dir:'encDireccionRecojo',titulo:'Lugar de recojo de la encomienda',icono:'ti-package'},
    {id:'admCompraUbicacion',dir:'admCompraDireccion',titulo:'Lugar de entrega de la compra',icono:'ti-home'},
    {id:'admCompraLugar',dir:null,titulo:'Dónde se hace la compra',icono:'ti-building-store',lugar:true},
    {id:'clienteUbicacion',dir:'clienteDireccion',titulo:'Ubicación del cliente',icono:'ti-user',ancla:'.pdcWithBtn'}
  ];
  const minis=new Map();
  function setVal(el,v){el.value=v;el.dispatchEvent(new Event('input',{bubbles:true}));el.dispatchEvent(new Event('change',{bubbles:true}))}
  function pintarCampo(cfg){
    const inp=$(cfg.id),box=inp&&$('pdmpB_'+cfg.id);if(!box)return;
    const k=coords(inp.value),pv=box.querySelector('.pdmpPv'),st=box.querySelector('.pdmpSt'),bt=box.querySelector('.pdmpBt span');
    bt.textContent=k?'Cambiar en el mapa':'Marcar en el mapa';
    if(k){st.className='pdmpSt';st.innerHTML=fx(k.lat)+', '+fx(k.lng)+' · <a href="'+linkDe(k)+'" target="_blank" rel="noopener">Ver en Google Maps</a>'}
    else if(esCorto(inp.value)){st.className='pdmpSt bad';st.textContent='Este enlace corto no trae coordenadas: la tarifa no se puede calcular. Márcalo en el mapa.'}
    else{st.className='pdmpSt';st.textContent=''}
    pv.hidden=!k;
    if(k&&pv.offsetWidth)leaflet().then(L=>{
      let mm=minis.get(cfg.id);const el=pv.querySelector('.mp');
      if(!mm||mm.getContainer()!==el){mm=L.map(el,{zoomControl:false,dragging:false,touchZoom:false,scrollWheelZoom:false,doubleClickZoom:false,boxZoom:false,keyboard:false,tap:false}).setView([k.lat,k.lng],17);L.tileLayer(TILES,{maxZoom:19,attribution:ATTR}).addTo(mm);minis.set(cfg.id,mm)}
      else{mm.invalidateSize();mm.setView([k.lat,k.lng],17,{animate:false})}
    }).catch(()=>{});
  }
  async function abrirCampo(cfg){
    const inp=$(cfg.id);if(!inp)return;
    const r=await elegir({titulo:cfg.titulo,icono:cfg.icono,centro:coords(inp.value)});
    if(!r)return;
    const link=linkDe(r);
    if(cfg.lugar){const nombre=inp.value.replace(/https?:\/\/\S+/g,'').replace(/[\s·–-]+$/,'').trim()||[r.linea,r.sub].filter(Boolean).join(', ');setVal(inp,(nombre?nombre+' · ':'')+link)}
    else setVal(inp,link);
    const d=cfg.dir&&$(cfg.dir);if(d&&!d.value.trim()&&r.linea)setVal(d,[r.linea,r.sub].filter(Boolean).join(', '));
    pintarCampo(cfg);
  }
  function montar(){
    CAMPOS.forEach(cfg=>{
      const inp=$(cfg.id);if(!inp)return;
      if(!$('pdmpB_'+cfg.id)){
        const b=document.createElement('div');b.className='pdmpBox';b.id='pdmpB_'+cfg.id;
        b.innerHTML='<button type="button" class="pdmpBt"><svg class="pdmpI" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7l6-3 6 3 6-3v13l-6 3-6-3-6 3z"/><path d="M9 4v13M15 7v13"/></svg><span>Marcar en el mapa</span></button><div class="pdmpPv" hidden><div class="mp"></div><div class="pin">'+PIN+'</div></div><div class="pdmpSt"></div>';
        const anc=cfg.ancla&&inp.closest(cfg.ancla);if(anc)anc.insertAdjacentElement('afterend',b);else (inp.closest('.field')||inp.parentElement).appendChild(b);
        b.querySelector('.pdmpBt').onclick=e=>{e.preventDefault();abrirCampo(cfg)};
        b.querySelector('.pdmpPv').onclick=()=>abrirCampo(cfg);
        inp.addEventListener('input',()=>pintarCampo(cfg));
        if(cfg.lugar&&!inp.placeholder)inp.placeholder='Nombre del lugar (opcional: márcalo en el mapa)';
      }
      const f=inp.value+'|'+!!$('pdmpB_'+cfg.id).offsetWidth;if(inp.dataset.pdmpF!==f){inp.dataset.pdmpF=f;pintarCampo(cfg)}
    });
  }
  setInterval(()=>{try{montar()}catch(e){}},800);
})();
</script>

<!-- ===== Pidemás · Tienda: cuenta con Google estilo app + datos y ubicación para los pedidos ===== -->

<script id="pidemas-tienda-cuenta-js">
(function(){

  const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const SVG=p=>'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+p+'</svg>';

    receipt:SVG('<path d="M5 21v-16a2 2 0 0 1 2 -2h10a2 2 0 0 1 2 2v16l-3 -2l-2 2l-2 -2l-2 2l-2 -2l-3 2"/><path d="M9 7h6"/><path d="M9 11h6"/><path d="M9 15h4"/>'),
