# Construye el APK de la tienda y publica assetlinks.json para la tienda y los 3 paneles.
# Descarga directa: https://github.com/pidemasdelivery/pidemasdelivery.github.io/releases/latest/download/pidemas-tienda.apk
name: Construir APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Direccion de la tienda
        run: |
          OWNER=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          REPO="${GITHUB_REPOSITORY#*/}"
          HOST="pidemas.pe"
          if [ "$(echo "$REPO" | tr '[:upper:]' '[:lower:]')" = "$OWNER.github.io" ]; then URL="https://$HOST/"; else URL="https://$HOST/$REPO/"; fi
          echo "HOST=$HOST" >> "$GITHUB_ENV"
          echo "URL=$URL" >> "$GITHUB_ENV"
          echo "VCODE=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          echo "La app abrira: $URL"

      # La clave de firma NO vive en el repositorio (es publico). Se lee de los secrets del repo:
      #   KEYSTORE_BASE64   -> el archivo .keystore en base64
      #   KEYSTORE_PASSWORD -> contrasena del keystore y de la clave (alias "pidemas")
      - name: Clave de firma (desde los secrets del repositorio)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Faltan los secrets KEYSTORE_BASE64 y/o KEYSTORE_PASSWORD (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/firma"
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/firma/pidemas.keystore"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/firma/pidemas.keystore" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"

      - name: Armar el proyecto Android
        run: |
          A=_android
          mkdir -p $A/app/src/main/res/values $A/app/src/main/res/drawable-nodpi $A/app/src/main/res/mipmap-nodpi \
                   $A/app/src/main/res/mipmap-anydpi-v26 $A/app/src/main/res/drawable-v26
          cat > $A/settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "PidemasTienda"
          include ':app'
          EOF
          cat > $A/build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOF
          cat > $A/gradle.properties <<'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2g
          EOF
          cat > $A/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
            namespace 'pe.pidemas.tienda'
            compileSdk 34
            defaultConfig {
              applicationId 'pe.pidemas.tienda'
              minSdk 21
              targetSdk 34
              versionCode((System.getenv('VCODE') ?: '1').toInteger())
              versionName "1.0.${System.getenv('VCODE') ?: '1'}"
              manifestPlaceholders = [hostName: System.getenv('HOST'), defaultUrl: System.getenv('URL')]
            }
            signingConfigs {
              release {
                storeFile file(System.getenv('KEYSTORE_FILE'))
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias 'pidemas'
                keyPassword System.getenv('KEYSTORE_PASSWORD')
              }
            }
            buildTypes { release { minifyEnabled false; signingConfig signingConfigs.release } }
            compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
            lint { checkReleaseBuilds false; abortOnError false }
          }
          dependencies { implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0' }
          EOF
          cat > $A/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <queries>
                  <intent>
                      <action android:name="android.support.customtabs.action.CustomTabsService"/>
                  </intent>
              </queries>
              <application
                  android:label="@string/app_name"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:allowBackup="true"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Translucent.NoTitleBar">
                  <meta-data android:name="asset_statements" android:resource="@string/asset_statements"/>
                  <activity
                      android:name="com.google.androidbrowserhelper.trusted.LauncherActivity"
                      android:exported="true"
                      android:alwaysRetainTaskState="true"
                      android:label="@string/app_name">
                      <meta-data android:name="android.support.customtabs.trusted.DEFAULT_URL" android:value="${defaultUrl}"/>
                      <meta-data android:name="android.support.customtabs.trusted.STATUS_BAR_COLOR" android:resource="@color/fondo"/>
                      <meta-data android:name="android.support.customtabs.trusted.NAVIGATION_BAR_COLOR" android:resource="@color/fondo"/>
                      <!-- Pantalla de carga de Pidemás mientras abre Chrome (sin barra de dirección) -->
                      <meta-data android:name="android.support.customtabs.trusted.SPLASH_IMAGE_DRAWABLE" android:resource="@drawable/splash"/>
                      <meta-data android:name="android.support.customtabs.trusted.SPLASH_SCREEN_BACKGROUND_COLOR" android:resource="@color/fondo"/>
                      <meta-data android:name="android.support.customtabs.trusted.SPLASH_SCREEN_FADE_OUT_DURATION" android:value="300"/>
                      <meta-data android:name="android.support.customtabs.trusted.FILE_PROVIDER_AUTHORITY" android:value="${applicationId}.fileprovider"/>
                      <meta-data android:name="android.support.customtabs.trusted.SCREEN_ORIENTATION" android:value="portrait"/>
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                      <intent-filter android:autoVerify="true">
                          <action android:name="android.intent.action.VIEW"/>
                          <category android:name="android.intent.category.DEFAULT"/>
                          <category android:name="android.intent.category.BROWSABLE"/>
                          <data android:scheme="https" android:host="${hostName}"/>
                          <!-- Solo la tienda abre la app; /inscripcion/, /demo/ y los paneles se abren en el navegador o en su propia app -->
                          <data android:path="/"/>
                          <data android:path="/index.html"/>
                      </intent-filter>
                  </activity>
                  <service
                      android:name="com.google.androidbrowserhelper.trusted.DelegationService"
                      android:exported="true"
                      android:enabled="true">
                      <intent-filter>
                          <action android:name="android.support.customtabs.trusted.TRUSTED_WEB_ACTIVITY_SERVICE"/>
                          <category android:name="android.intent.category.DEFAULT"/>
                      </intent-filter>
                  </service>
                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="${applicationId}.fileprovider"
                      android:grantUriPermissions="true"
                      android:exported="false">
                      <meta-data android:name="android.support.FILE_PROVIDER_PATHS" android:resource="@xml/filepaths"/>
                  </provider>
              </application>
          </manifest>
          EOF
          cat > $A/app/src/main/res/values/colors.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="fondo">#FFF9F5</color>
              <color name="naranja">#FF5E29</color>
          </resources>
          EOF
          printf '%s\n' '<?xml version="1.0" encoding="utf-8"?>' '<resources>' \
            '    <string name="app_name">Pidemás</string>' \
            "    <string name=\"asset_statements\">[{\\\"relation\\\": [\\\"delegate_permission/common.handle_all_urls\\\"], \\\"target\\\": {\\\"namespace\\\": \\\"web\\\", \\\"site\\\": \\\"https://$HOST\\\"}}]</string>" \
            '</resources>' > $A/app/src/main/res/values/strings.xml
          ICON=icon-maskable-512.png; [ -f "$ICON" ] || ICON=icon-512.png
          cp "$ICON" $A/app/src/main/res/drawable-nodpi/icono.png
          SPL=splash.png; [ -f "$SPL" ] || SPL="$ICON"
          cp "$SPL" $A/app/src/main/res/drawable-nodpi/splash.png
          mkdir -p $A/app/src/main/res/xml
          printf '%s\n' '<?xml version="1.0" encoding="utf-8"?>' '<paths><files-path path="twa_splash/" name="twa_splash"/></paths>' > $A/app/src/main/res/xml/filepaths.xml
          cp "$ICON" $A/app/src/main/res/mipmap-nodpi/ic_launcher.png
          cat > $A/app/src/main/res/drawable-v26/icono_centro.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <inset xmlns:android="http://schemas.android.com/apk/res/android"
              android:drawable="@drawable/icono"
              android:inset="16.67%"/>
          EOF
          cat > $A/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/naranja"/>
              <foreground android:drawable="@drawable/icono_centro"/>
          </adaptive-icon>
          EOF

      - name: Construir APK
        run: |
          cd _android
          gradle --no-daemon assembleRelease
          mkdir -p ../salida
          cp app/build/outputs/apk/release/app-release.apk ../salida/pidemas-tienda.apk
          FP=$(keytool -list -v -keystore "$KEYSTORE_FILE" -alias pidemas -storepass "$KEYSTORE_PASSWORD" | grep 'SHA256:' | head -1 | sed 's/.*SHA256: *//')
          # Junta la huella de la tienda con la de los paneles (admin, motorizado, negocio)
          echo "pe.pidemas.tienda $FP" > ../salida/huellas.txt
          for P in admin motorizado negocio; do
            curl -fsSL "https://raw.githubusercontent.com/$GITHUB_REPOSITORY_OWNER/$P/main/firma/huella.txt" 2>/dev/null \
              | tr -d '\r' | grep -E '^[a-z0-9_.]+ [0-9A-F:]+$' >> ../salida/huellas.txt || echo "Aun no hay huella de $P"
          done
          cat ../salida/huellas.txt
          jq -R -s 'split("\n") | map(select(length>0) | split(" ") | {relation:["delegate_permission/common.handle_all_urls"], target:{namespace:"android_app", package_name:.[0], sha256_cert_fingerprints:[.[1]]}})' \
            ../salida/huellas.txt > ../salida/assetlinks.json
          cat ../salida/assetlinks.json
          echo "Huella de la firma: $FP"

      - name: Publicar assetlinks.json (quita la barra de la direccion en la app)
        run: |
          mkdir -p .well-known
          cp salida/assetlinks.json .well-known/assetlinks.json
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add .well-known/assetlinks.json
          if ! git diff --cached --quiet; then
            git commit -m "assetlinks de la app [skip ci]"
            git pull --rebase
            git push
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: pidemas-tienda-apk
          path: salida/

      - name: Publicar APK para descarga directa
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v${{ github.run_number }}
          name: Pidemás app ${{ github.run_number }}
          make_latest: true
          files: salida/pidemas-tienda.apk
